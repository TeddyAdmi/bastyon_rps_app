<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра КНБ</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .profile-card {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      gap: 12px;
      text-align: left;
    }
    .profile-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #333;
      border: 2px solid #00ff88;
    }
    .profile-info { flex: 1; overflow: hidden; }
    .profile-name { font-weight: bold; font-size: 1.05em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-address { font-size: 0.75em; color: #888; font-family: monospace; margin-top: 2px; }
    .profile-balance { font-size: 0.9em; font-weight: 600; color: #00ff88; margin-top: 4px; }
    .rooms { display: flex; gap: 10px; margin-bottom: 20px; }
    .room-btn { flex: 1; padding: 10px; border: 2px solid #444; border-radius: 8px; background: #333; color: white; cursor: pointer; font-weight: bold; }
    .room-btn.active { border-color: #00ff88; background: #1e3a29; }
    .buttons { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
    .game-btn { font-size: 2em; padding: 10px 15px; border: none; border-radius: 8px; background: #333; cursor: pointer; transition: transform 0.1s, background 0.2s; }
    .game-btn:hover { background: #444; transform: scale(1.05); }
    .game-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .result { font-size: 1.1em; font-weight: bold; margin-top: 15px; min-height: 1.5em; }
    #status { color: #00ff88; font-size: 0.85em; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🪨 ✂️ 📄 Игра КНБ</h1>
    
    <div class="profile-card">
      <img id="user-avatar" class="profile-avatar" src="https://bastyon.com/images/user.png" alt="Avatar" crossorigin="anonymous" />
      <div class="profile-info">
        <div id="user-name" class="profile-name">Загрузка...</div>
        <div id="user-address" class="profile-address">Адрес: --</div>
        <div id="user-balance" class="profile-balance">0.0000 PKOIN</div>
      </div>
    </div>

    <div class="rooms">
      <button class="room-btn active" id="mode-demo" onclick="selectRoom('demo')">🤖 Демо (0 PKOIN)</button>
      <button class="room-btn" id="mode-pvp" onclick="selectRoom('pvp')">⚔️ Игроки (1 PKOIN)</button>
    </div>

    <div class="buttons">
      <button class="game-btn" onclick="makeMove('rock')" id="btn-rock" disabled>🪨</button>
      <button class="game-btn" onclick="makeMove('scissors')" id="btn-scissors" disabled>✂️</button>
      <button class="game-btn" onclick="makeMove('paper')" id="btn-paper" disabled>📄</button>
    </div>

    <div class="result" id="result-text">Выберите режим и сделайте ваш ход!</div>
    <p id="status">Запуск Bastyon SDK...</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
  const statusEl = document.getElementById('status');
  
  if (!window.BastyonSdk) {
    statusEl.style.color = '#ff4444';
    statusEl.innerText = '❌ SDK не обнаружен. Откройте внутри Bastyon!';
    return;
  }

  try {
    sdk = new window.BastyonSdk();
    await sdk.init();

    // 1. Запрос прав (если отклонено — выводим на экран)
    if (sdk.permissions && typeof sdk.permissions.request === 'function') {
      try {
        await sdk.permissions.request(['account', 'payment']);
      } catch (pErr) {
        statusEl.style.color = '#ffaa00';
        statusEl.innerText = '⚠️ Bastyon отклонил запрос прав (account/payment)';
      }
    }

    // 2. Получение адреса
    try {
      const acc = await sdk.get.account();
      if (acc && acc.address) {
        userAddress = acc.address;
        document.getElementById('user-address').innerText = `${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
      }
    } catch (aErr) {
      statusEl.innerText = '❌ Ошибка доступа к account: ' + aErr.message;
    }

    // 3. Получение баланса
    try {
      const bal = await sdk.get.balance();
      document.getElementById('user-balance').innerText = `${parseFloat(bal || 0).toFixed(4)} PKOIN`;
    } catch (bErr) {
      console.warn('Баланс заблокирован:', bErr);
    }

    // 4. Получение имени и аватара через getuserprofile
    if (userAddress && sdk.get && typeof sdk.get.getuserprofile === 'function') {
      try {
        const res = await sdk.get.getuserprofile([userAddress]);
        if (res && res[0]) {
          const profile = res[0];
          if (profile.name) document.getElementById('user-name').innerText = profile.name;
          if (profile.i) document.getElementById('user-avatar').src = profile.i;
        }
      } catch (prErr) {
        console.warn('Профиль заблокирован:', prErr);
      }
    }

    sdk.emit('loaded');
    statusEl.innerText = '● Подключено к Bastyon';
    enableButtons(true);

  } catch (err) {
    statusEl.style.color = '#ff4444';
    statusEl.innerText = '❌ Ошибка инициализации: ' + err.message;
  }
});
  </script>
</body>
</html>
