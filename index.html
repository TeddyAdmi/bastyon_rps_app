  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #1a1a1a;

      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 420px;

      margin: 20px auto;
      padding: 20px;

      background: #2a2a2a;

      border-radius: 16px;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 20px;

      font-size: 28px;

      text-align: center;
    }

    /* =========================================
       PROFILE
       ========================================= */

    .profile-card {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px;

      margin-bottom: 20px;

      background: #1e1e1e;

      border: 1px solid #333;

      border-radius: 12px;
    }

    .profile-avatar {
      width: 54px;
      height: 54px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      background: #333;

      border: 2px solid #00ff88;

      display: block;
    }

    .profile-info {
      min-width: 0;

      flex: 1;
    }

    .profile-name {
      font-size: 17px;

      font-weight: 700;

      color: #fff;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .profile-address {
      margin-top: 3px;

      font-family: monospace;

      font-size: 12px;

      color: #888;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .profile-balance {
      margin-top: 5px;

      font-size: 14px;

      font-weight: 700;

      color: #00ff88;
    }

    /* =========================================
       ROOMS
       ========================================= */

    .rooms {
      display: flex;

      gap: 10px;

      margin-bottom: 20px;
    }

    .room-btn {
      flex: 1;

      padding: 12px 8px;

      border: 2px solid #444;

      border-radius: 10px;

      background: #333;

      color: #fff;

      cursor: pointer;

      font-size: 14px;

      font-weight: 700;

      transition:
        background 0.2s,
        border-color 0.2s,
        transform 0.1s;
    }

    .room-btn:hover {
      background: #3d3d3d;
    }

    .room-btn:active {
      transform: scale(0.98);
    }

    .room-btn.active {
      border-color: #00ff88;

      background: #1e3a29;
    }

    /* =========================================
       GAME BUTTONS
       ========================================= */

    .buttons {
      display: flex;

      justify-content: center;

      gap: 12px;

      margin: 25px 0;
    }

    .game-btn {
      width: 95px;
      height: 95px;

      padding: 10px;

      border: 2px solid #444;

      border-radius: 14px;

      background: #333;

      color: #fff;

      cursor: pointer;

      font-size: 42px;

      transition:
        transform 0.15s,
        background 0.2s,
        border-color 0.2s;
    }

    .game-btn:hover:not(:disabled) {
      background: #444;

      border-color: #00ff88;

      transform: translateY(-3px);
    }

    .game-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .game-btn:disabled {
      opacity: 0.4;

      cursor: not-allowed;
    }

    /* =========================================
       RESULT
       ========================================= */

    .result {
      min-height: 70px;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #202020;

      font-size: 16px;

      font-weight: 700;

      text-align: center;

      line-height: 1.4;
    }

    /* =========================================
       STATUS
       ========================================= */

    #status {
      margin: 15px 0 0;

      color: #00ff88;

      font-size: 13px;

      text-align: center;

      line-height: 1.4;
    }

    .error {
      color: #ff4444 !important;
    }

    .warning {
      color: #ffaa00 !important;
    }

    .success {
      color: #00ff88 !important;
    }

    .muted {
      color: #888 !important;
    }

    /* =========================================
       PVP INFO
       ========================================= */

    .pvp-info {
      display: none;

      margin-top: 12px;

      padding: 12px;

      border-radius: 10px;

      background: #202020;

      border: 1px solid #333;

      font-size: 13px;

      line-height: 1.5;

      color: #aaa;

      text-align: center;
    }

    .pvp-info.show {
      display: block;
    }

    .room-id {
      margin-top: 6px;

      color: #00ff88;

      font-family: monospace;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .card {
        margin: 10px auto;
        padding: 16px;
      }

      .game-btn {
        width: 82px;
        height: 82px;

        font-size: 36px;
      }
    }
  </style>

</head>

  </div>

  <script>

    /* =========================================
       GLOBAL
       ========================================= */

    let sdk = null;

    let userAddress = null;

    let currentRoom = "demo";

    let currentPvpRoom = null;


    /* =========================================
       DEFAULT AVATAR
       ========================================= */

    const DEFAULT_AVATAR =
      "data:image/svg+xml;utf8," +
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
      "<circle cx='50' cy='50' r='50' fill='%23333333'/>" +
      "<circle cx='50' cy='38' r='18' fill='%23888888'/>" +
      "<path d='M20 90c4-22 18-32 30-32s26 10 30 32' fill='%23888888'/>" +
      "</svg>";


    /* =========================================
       CHOICES
       ========================================= */

    const choices = {

      rock: "🪨 Камень",

      scissors: "✂️ Ножницы",

      paper: "📄 Бумага"

    };


    /* =========================================
       BUTTONS
       ========================================= */

    function enableButtons(enable) {

      const ids = [
        "btn-rock",
        "btn-scissors",
        "btn-paper"
      ];

      ids.forEach(
        function(id) {

          const button =
            document.getElementById(id);

          if (button) {

            button.disabled =
              !enable;

          }

        }
      );

    }


    /* =========================================
       ROOM
       ========================================= */

    function selectRoom(room) {

      currentRoom = room;

      document
        .getElementById("mode-demo")
        .classList.toggle(
          "active",
          room === "demo"
        );

      document
        .getElementById("mode-pvp")
        .classList.toggle(
          "active",
          room === "pvp"
        );

      const result =
        document.getElementById(
          "result-text"
        );

      const pvpInfo =
        document.getElementById(
          "pvp-info"
        );

      if (room === "demo") {

        result.innerText =
          "Бесплатная игра с компьютером.";

        pvpInfo.classList.remove(
          "show"
        );

      } else {

        result.innerText =
          "Игра между игроками — ставка 1 PKOIN.";

        pvpInfo.classList.add(
          "show"
        );

      }

    }


    /* =========================================
       ADDRESS
       ========================================= */

    function shortAddress(
      address
    ) {

      if (!address) {

        return "Адрес: --";

      }

      const text =
        String(address);

      if (text.length <= 12) {

        return text;

      }

      return (
        text.slice(0, 6) +
        "..." +
        text.slice(-4)
      );

    }


    function showAddress(
      address
    ) {

      const element =
        document.getElementById(
          "user-address"
        );

      if (!element) {

        return;

      }

      element.innerText =
        address
          ? shortAddress(address)
          : "Адрес: не определён";

    }


    /* =========================================
       BALANCE
       ========================================= */

    function findBalance(
      balanceData
    ) {

      if (
        typeof balanceData ===
        "number"
      ) {

        return balanceData;

      }

      if (
        !balanceData ||
        typeof balanceData !==
        "object"
      ) {

        return null;

      }

      const priority = [

        balanceData.actual,

        balanceData.total,

        balanceData.balance,

        balanceData.confirmed,

        balanceData.available,

        balanceData.amount

      ];

      for (
        const value of priority
      ) {

        if (
          typeof value === "number" &&
          Number.isFinite(value)
        ) {

          return value;

        }

      }

      return null;

    }


    function showBalance(
      balanceData
    ) {

      const element =
        document.getElementById(
          "user-balance"
        );

      if (!element) {

        return;

      }

      console.log(
        "BASTYON BALANCE DATA:",
        balanceData
      );

      const balance =
        findBalance(
          balanceData
        );

      if (
        balance === null
      ) {

        element.innerText =
          "Баланс недоступен";

        element.classList.add(
          "warning"
        );

        return;

      }

      element.innerText =
        Number(balance)
          .toFixed(4) +
        " PKOIN";

      element.classList.remove(
        "warning"
      );

    }


    /* =========================================
       PROFILE DATA
       ========================================= */

    function normalizeProfile(
      payload
    ) {

      if (
        !payload ||
        typeof payload !==
        "object"
      ) {

        return {};

      }

      let profile =
        payload.profile ||
        payload.result ||
        payload.data ||
        payload;

      if (
        profile &&
        typeof profile ===
        "object" &&
        profile.profile
      ) {

        profile =
          profile.profile;

      }

      if (
        Array.isArray(profile)
      ) {

        profile =
          profile[0] || {};

      }

      if (
        !profile ||
        typeof profile !==
        "object"
      ) {

        return {};

      }

      const name =
        profile.name ||
        profile.pName ||
        profile.nickname ||
        profile.username ||
        profile.displayName ||
        "";

      const avatar =
        profile.avatarUrl ||
        profile.avatar ||
        profile.image ||
        profile.imageUrl ||
        profile.i ||
        "";

      return {

        name:
          typeof name ===
          "string"
            ? name.trim()
            : "",

        avatar:
          typeof avatar ===
          "string"
            ? avatar.trim()
            : ""

      };

    }


    /* =========================================
       PROFILE IMAGE
       ========================================= */

    function normalizeAvatarUrl(
      avatar
    ) {

      if (!avatar) {

        return "";

      }

      let url =
        String(avatar).trim();

      if (!url) {

        return "";

      }

      if (
        url.startsWith("//")
      ) {

        return (
          "https:" +
          url
        );

      }

      if (
        /^https?:\/\//i.test(
          url
        )
      ) {

        return url;

      }

      if (
        url.startsWith("data:")
      ) {

        return url;

      }

      url =
        url.replace(
          /^\/+/,
          ""
        );

      if (
        url.startsWith("ipfs/")
      ) {

        return (
          "https://pocketnet.app/" +
          url
        );

      }

      return (
        "https://pocketnet.app/ipfs/" +
        url
      );

    }


    /* =========================================
       LOAD PROFILE
       ========================================= */

    async function loadProfileInfo(
      address
    ) {

      const avatarImg =
        document.getElementById(
          "user-avatar"
        );

      const nameEl =
        document.getElementById(
          "user-name"
        );

      if (!address) {

        nameEl.innerText =
          "Гость";

        avatarImg.src =
          DEFAULT_AVATAR;

        return;

      }

      avatarImg.src =
        DEFAULT_AVATAR;

      try {

        const response =
          await fetch(
            "/api/profile?address=" +
            encodeURIComponent(
              address
            ),
            {
              method: "GET",
              cache: "no-store"
            }
          );

        console.log(
          "PROFILE HTTP STATUS:",
          response.status
        );

        const text =
          await response.text();

        let payload = {};

        try {

          payload =
            JSON.parse(text);

        } catch (
          parseError
        ) {

          console.warn(
            "PROFILE NON JSON:",
            text
          );

          throw new Error(
            "Профиль вернул не JSON"
          );

        }

        console.log(
          "BASTYON PROFILE RAW:",
          payload
        );

        if (!response.ok) {

          throw new Error(
            payload.error ||
            payload.message ||
            "Profile HTTP " +
            response.status
          );

        }

        const profile =
          normalizeProfile(
            payload
          );

        console.log(
          "BASTYON PROFILE NORMALIZED:",
          profile
        );

        if (
          profile.name
        ) {

          nameEl.innerText =
            profile.name;

        } else {

          nameEl.innerText =
            "Игрок " +
            String(
              address
            ).slice(0, 6);

        }

        const avatarUrl =
          normalizeAvatarUrl(
            profile.avatar
          );

        if (avatarUrl) {

          avatarImg.onerror =
            function() {

              console.warn(
                "AVATAR LOAD ERROR:",
                avatarUrl
              );

              avatarImg.onerror =
                null;

              avatarImg.src =
                DEFAULT_AVATAR;

            };

          avatarImg.src =
            avatarUrl;

        }

      } catch (
        error
      ) {

        console.error(
          "PROFILE ERROR:",
          error
        );

        nameEl.innerText =
          "Игрок " +
          String(
            address
          ).slice(0, 6);

        avatarImg.src =
          DEFAULT_AVATAR;

      }

    }


    /* =========================================
       ACCOUNT
       ========================================= */

    async function getAccount() {

      if (
        !sdk ||
        !sdk.get ||
        typeof sdk.get.account !==
          "function"
      ) {

        return null;

      }

      try {

        const account =
          await sdk.get.account();

        console.log(
          "BASTYON ACCOUNT RAW:",
          account
        );

        if (
          typeof account ===
          "string"
        ) {

          return account;

        }

        if (
          account &&
          typeof account ===
          "object"
        ) {

          return (
            account.address ||
            account.addr ||
            account.id ||
            account.userId ||
            null
          );

        }

      } catch (
        error
      ) {

        console.error(
          "ACCOUNT ERROR:",
          error
        );

      }

      return null;

    }


    /* =========================================
       BALANCE
       ========================================= */

    async function getBalance() {

      if (
        !sdk ||
        !sdk.get ||
        typeof sdk.get.balance !==
          "function"
      ) {

        return null;

      }

      try {

        const balance =
          await sdk.get.balance();

        console.log(
          "BASTYON BALANCE RAW:",
          balance
        );

        return balance;

      } catch (
        error
      ) {

        console.error(
          "BALANCE ERROR:",
          error
        );

        return null;

      }

    }


    /* =========================================
       LOAD BASTYON
       ========================================= */

    async function loadBastyonUserData() {

      userAddress =
        await getAccount();

      showAddress(
        userAddress
      );

      if (userAddress) {

        await loadProfileInfo(
          userAddress
        );

      } else {

        document
          .getElementById(
            "user-name"
          )
          .innerText =
            "Гость";

        document
          .getElementById(
            "user-avatar"
          )
          .src =
            DEFAULT_AVATAR;

      }

      const balanceData =
        await getBalance();

      if (
        balanceData !== null
      ) {

        showBalance(
          balanceData
        );

      } else {

        const balanceElement =
          document.getElementById(
            "user-balance"
          );

        balanceElement.innerText =
          "Баланс недоступен";

        balanceElement.classList.add(
          "warning"
        );

      }

    }


    /* =========================================
       DEMO GAME
       ========================================= */

    function playDemoMatch(
      userChoice
    ) {

      const keys =
        Object.keys(
          choices
        );

      const botChoice =
        keys[
          Math.floor(
            Math.random() *
            keys.length
          )
        ];

      showResult(
        userChoice,
        botChoice,
        "Бот"
      );

    }


    /* =========================================
       PVP
       ========================================= */

    async function playPvpMatch(
      userChoice
    ) {

      const result =
        document.getElementById(
          "result-text"
        );

      const pvpInfo =
        document.getElementById(
          "pvp-info"
        );

      const pvpMessage =
        document.getElementById(
          "pvp-message"
        );

      const pvpRoom =
        document.getElementById(
          "pvp-room"
        );

      result.innerText =
        "⏳ Подключение к PvP...";

      pvpInfo.classList.add(
        "show"
      );

      try {

        const response =
          await fetch(
            "/api/pvp/join",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                userId:
                  userAddress ||
                  "demo-user",

                nickname:
                  document.getElementById(
                    "user-name"
                  ).innerText

              })

            }
          );

        const text =
          await response.text();

        let data = null;

        try {

          data =
            JSON.parse(
              text
            );

        } catch (
          error
        ) {

          console.warn(
            "PVP returned non-JSON:",
            text
          );

        }

        if (
          !response.ok
        ) {

          result.innerText =
            "❌ PvP API: " +
            response.status;

          return;

        }

        if (
          data &&
          data.room
        ) {

          currentPvpRoom =
            data.room;

          pvpRoom.innerText =
            "Комната: " +
            currentPvpRoom.id;

          if (
            currentPvpRoom.status ===
            "waiting"
          ) {

            pvpMessage.innerText =
              "Комната создана. Ожидание соперника...";

            result.innerText =
              "⏳ Ожидание второго игрока...";

          } else {

            pvpMessage.innerText =
              "Соперник подключён.";

            result.innerText =
              "✅ Соперник найден.";

          }

        } else {

          result.innerText =
            "Комната PvP создана.";

        }

      } catch (
        error
      ) {

        console.error(
          "PVP ERROR:",
          error
        );

        result.innerText =
          "❌ PvP сервер недоступен.";

      }

    }


    /* =========================================
       MOVE
       ========================================= */

    async function makeMove(
      userChoice
    ) {

      if (
        currentRoom ===
        "demo"
      ) {

        playDemoMatch(
          userChoice
        );

        return;

      }

      await playPvpMatch(
        userChoice
      );

    }


    /* =========================================
       RESULT
       ========================================= */

    function showResult(
      userChoice,
      opponentChoice,
      opponentName
    ) {

      let resultMessage =
        "";

      if (
        userChoice ===
        opponentChoice
      ) {

        resultMessage =
          "Ничья! Оба выбрали " +
          choices[
            userChoice
          ];

      }

      else if (

        (
          userChoice ===
            "rock" &&
          opponentChoice ===
            "scissors"
        )

        ||

        (
          userChoice ===
            "scissors" &&
          opponentChoice ===
            "paper"
        )

        ||

        (
          userChoice ===
            "paper" &&
          opponentChoice ===
            "rock"
        )

      ) {

        resultMessage =
          "🎉 Вы выиграли! " +
          choices[
            userChoice
          ] +
          " бьет " +
          choices[
            opponentChoice
          ];

      }

      else {

        resultMessage =
          "💥 " +
          opponentName +
          " победил! " +
          choices[
            opponentChoice
          ] +
          " бьет " +
          choices[
            userChoice
          ];

      }

      document
        .getElementById(
          "result-text"
        )
        .innerText =
          resultMessage;

    }


    /* =========================================
       INIT
       ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        const status =
          document.getElementById(
            "status"
          );

        if (
          !window.BastyonSdk
        ) {

          status.classList.add(
            "error"
          );

          status.innerText =
            "❌ SDK Bastyon не обнаружен";

          enableButtons(true);

          return;

        }

        try {

          sdk =
            new window.BastyonSdk();

          if (
            typeof sdk.init ===
            "function"
          ) {

            await sdk.init();

          }

          if (
            sdk.permissions &&
            typeof sdk.permissions.request ===
              "function"
          ) {

            try {

              await sdk.permissions.request([
                "account",
                "payment",
                "rpc"
              ]);

            } catch (
              error
            ) {

              console.warn(
                "PERMISSIONS ERROR:",
                error
              );

            }

          }

          await loadBastyonUserData();

          if (
            typeof sdk.on ===
            "function"
          ) {

            sdk.on(
              "balance",
              function(
                newBalance
              ) {

                console.log(
                  "BASTYON BALANCE EVENT:",
                  newBalance
                );

                showBalance(
                  newBalance
                );

              }
            );

          }

          if (
            typeof sdk.emit ===
            "function"
          ) {

            sdk.emit(
              "loaded"
            );

          }

          status.classList.remove(
            "error"
          );

          status.classList.add(
            "success"
          );

          status.innerText =
            "● Bastyon подключён";

          enableButtons(
            true
          );

        } catch (
          error
        ) {

          console.error(
            "SDK ERROR:",
            error
          );

          status.classList.add(
            "error"
          );

          status.innerText =
            "❌ Ошибка SDK: " +
            (
              error.message ||
              "Ошибка"
            );

          enableButtons(
            true
          );

        }

      }
    );

  </script>

</body>
</html>
