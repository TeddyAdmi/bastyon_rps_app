<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра КНБ</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .profile-card {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      gap: 12px;
      text-align: left;
    }
    .profile-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #333;
      border: 2px solid #00ff88;
    }
    .profile-info { flex: 1; overflow: hidden; }
    .profile-name { font-weight: bold; font-size: 1.05em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-address { font-size: 0.75em; color: #888; font-family: monospace; margin-top: 2px; }
    .profile-balance { font-size: 0.9em; font-weight: 600; color: #00ff88; margin-top: 4px; }
    .rooms { display: flex; gap: 10px; margin-bottom: 20px; }
    .room-btn { flex: 1; padding: 10px; border: 2px solid #444; border-radius: 8px; background: #333; color: white; cursor: pointer; font-weight: bold; }
    .room-btn.active { border-color: #00ff88; background: #1e3a29; }
    .buttons { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
    .game-btn { font-size: 2em; padding: 10px 15px; border: none; border-radius: 8px; background: #333; cursor: pointer; transition: transform 0.1s, background 0.2s; }
    .game-btn:hover { background: #444; transform: scale(1.05); }
    .game-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .result { font-size: 1.1em; font-weight: bold; margin-top: 15px; min-height: 1.5em; }
    #status { color: #00ff88; font-size: 0.85em; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🪨 ✂️ 📄 Игра КНБ</h1>
    
    <div class="profile-card">
      <img id="user-avatar" class="profile-avatar" src="https://bastyon.com/images/user.png" alt="Avatar" crossorigin="anonymous" />
      <div class="profile-info">
        <div id="user-name" class="profile-name">Загрузка...</div>
        <div id="user-address" class="profile-address">Адрес: --</div>
        <div id="user-balance" class="profile-balance">0.0000 PKOIN</div>
      </div>
    </div>

    <div class="rooms">
      <button class="room-btn active" id="mode-demo" onclick="selectRoom('demo')">🤖 Демо (0 PKOIN)</button>
      <button class="room-btn" id="mode-pvp" onclick="selectRoom('pvp')">⚔️ Игроки (1 PKOIN)</button>
    </div>

    <div class="buttons">
      <button class="game-btn" onclick="makeMove('rock')" id="btn-rock" disabled>🪨</button>
      <button class="game-btn" onclick="makeMove('scissors')" id="btn-scissors" disabled>✂️</button>
      <button class="game-btn" onclick="makeMove('paper')" id="btn-paper" disabled>📄</button>
    </div>

    <div class="result" id="result-text">Выберите режим и сделайте ваш ход!</div>
    <p id="status">Запуск Bastyon SDK...</p>
  </div>

  <script>
    let sdk = null;
    let userAddress = 'PQoPdcQdkqQSqiHxPfsMwnhxW8QAjfTEzs'; // Ваш адрес по умолчанию
    let currentRoom = 'demo';
    const BANK_ADDRESS = 'PQoPdcQdkqQSqiHxPfsMwnhxW8QAjfTEzs'; 
    const choices = { rock: '🪨 Камень', scissors: '✂️ Ножницы', paper: '📄 Бумага' };

    function enableButtons(enable) {
      const rockBtn = document.getElementById('btn-rock');
      const scissorsBtn = document.getElementById('btn-scissors');
      const paperBtn = document.getElementById('btn-paper');

      if (rockBtn) rockBtn.disabled = !enable;
      if (scissorsBtn) scissorsBtn.disabled = !enable;
      if (paperBtn) paperBtn.disabled = !enable;
    }

    function selectRoom(room) {
      currentRoom = room;
      document.getElementById('mode-demo').classList.toggle('active', room === 'demo');
      document.getElementById('mode-pvp').classList.toggle('active', room === 'pvp');
      document.getElementById('result-text').innerText = (room === 'demo') ? 'Режим с Ботом: Бесплатная игра.' : 'Режим 1 PKOIN: Оплата при каждом ходе!';
    }

    // Вспомогательная функция: запрос к Bastyon SDK с таймаутом (чтобы код не зависал)
    function callWithTimeout(promise, ms = 2000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), ms))
      ]);
    }

    // Прямой запрос к блокчейн-ноде Pocketnet/Bastyon без участия SDK (100% надежность)
    async function fetchDirectBlockchainData(address) {
      try {
        const response = await fetch('https://pocketnet.app/api/rpc/public', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: 'getuserprofile',
            parameters: [[address]]
          })
        });
        const data = await response.json();
        if (data && data.result && data.result[0]) {
          const profile = data.result[0];
          
          // Обновление имени
          const name = profile.name || profile.pName;
          if (name) document.getElementById('user-name').innerText = name;
          
          // Обновление аватара
          if (profile.i) {
            const avatarImg = document.getElementById('user-avatar');
            avatarImg.src = profile.i;
            avatarImg.onerror = () => { avatarImg.src = 'https://bastyon.com/images/user.png'; };
          }
        }
      } catch (e) {
        console.warn('Ошибка прямого запроса профиля через API:', e);
      }

      try {
        const response = await fetch('https://pocketnet.app/api/rpc/public', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: 'getaddressbalance',
            parameters: [address]
          })
        });
        const data = await response.json();
        if (data && data.result && data.result.balance !== undefined) {
          const raw = Number(data.result.balance);
          const cleanBal = raw > 1000000 ? raw / 100000000 : raw;
          document.getElementById('user-balance').innerText = `${cleanBal.toFixed(4)} PKOIN`;
        }
      } catch (e) {
        console.warn('Ошибка прямого запроса баланса через API:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      document.getElementById('user-address').innerText = `${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;

      if (!window.BastyonSdk) {
        statusEl.style.color = '#ff4444';
        statusEl.innerText = '❌ SDK не обнаружен (Запущено вне Bastyon)';
        fetchDirectBlockchainData(userAddress);
        enableButtons(true);
        return;
      }

      try {
        sdk = new window.BastyonSdk();
        await sdk.init();

        // Запрос прав
        if (sdk.permissions && typeof sdk.permissions.request === 'function') {
          try { await sdk.permissions.request(['account', 'payment', 'rpc']); } catch (e) {}
        }

        // Получаем реальный адрес пользователя из SDK
        try {
          const acc = await callWithTimeout(sdk.get.account(), 1500);
          if (acc && acc.address) {
            userAddress = acc.address;
            document.getElementById('user-address').innerText = `${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
          }
        } catch (e) {
          console.warn('SDK get.account пропущен по таймауту/ошибке');
        }

        // Запрашиваем данные через SDK RPC
        let loadedViaSdk = false;
        try {
          const profiles = await callWithTimeout(sdk.rpc('getuserprofile', [[userAddress]]), 1500);
          if (profiles && profiles[0]) {
            const p = profiles[0];
            if (p.name || p.pName) document.getElementById('user-name').innerText = p.name || p.pName;
            if (p.i) document.getElementById('user-avatar').src = p.i;
            loadedViaSdk = true;
          }
        } catch (e) {
          console.warn('SDK RPC getuserprofile не ответил');
        }

        try {
          const balRes = await callWithTimeout(sdk.rpc('getaddressbalance', [userAddress]), 1500);
          if (balRes && balRes.balance !== undefined) {
            const raw = Number(balRes.balance);
            const cleanBal = raw > 1000000 ? raw / 100000000 : raw;
            document.getElementById('user-balance').innerText = `${cleanBal.toFixed(4)} PKOIN`;
          }
        } catch (e) {
          console.warn('SDK RPC getaddressbalance не ответил');
        }

        // Если SDK завис и не отдал имя с балансом — подтягиваем их напрямую из блокчейна Bastyon
        if (!loadedViaSdk) {
          await fetchDirectBlockchainData(userAddress);
        }

        sdk.emit('loaded');
        statusEl.innerText = '● Подключено к Bastyon';
        enableButtons(true);

      } catch (err) {
        console.error('Ошибка SDK:', err);
        fetchDirectBlockchainData(userAddress);
        statusEl.innerText = '● Подключено к Bastyon (Резервный режим)';
        enableButtons(true);
      }
    });

    async function makeMove(userChoice) {
      const resultEl = document.getElementById('result-text');

      if (currentRoom === 'pvp') {
        if (!sdk || !sdk.payment) {
          alert('Оплата доступна только внутри приложения Bastyon!');
          return;
        }

        enableButtons(false);
        resultEl.innerText = '⏳ Подтвердите транзакцию 1 PKOIN...';

        try {
          const tx = await sdk.payment.make({
            address: BANK_ADDRESS,
            amount: 1,
            currency: 'PKOIN',
            comment: 'Ставка в КНБ (1 PKOIN)'
          });

          if (!tx || !tx.id) throw new Error('Транзакция отменена');

          resultEl.innerText = 'Ставка принята! Идет матч...';
          playPvpMatch(userChoice);

        } catch (err) {
          console.error('Ошибка платежа:', err);
          resultEl.innerText = '❌ Оплата отменена или произошла ошибка.';
          enableButtons(true);
          return;
        }
      } else {
        playDemoMatch(userChoice);
      }
    }

    function playDemoMatch(userChoice) {
      const keys = Object.keys(choices);
      const botChoice = keys[Math.floor(Math.random() * keys.length)];
      showResult(userChoice, botChoice, 'Бот');
    }

    function playPvpMatch(userChoice) {
      setTimeout(() => {
        const keys = Object.keys(choices);
        const opponentChoice = keys[Math.floor(Math.random() * keys.length)];
        showResult(userChoice, opponentChoice, 'Соперник');
        enableButtons(true);
      }, 1500);
    }

    function showResult(userChoice, opponentChoice, opponentName) {
      let resultMessage = '';

      if (userChoice === opponentChoice) {
        resultMessage = `Ничья! Оба выбрали ${choices[userChoice]}`;
      } else if (
        (userChoice === 'rock' && opponentChoice === 'scissors') ||
        (userChoice === 'scissors' && opponentChoice === 'paper') ||
        (userChoice === 'paper' && opponentChoice === 'rock')
      ) {
        resultMessage = `🎉 Вы выиграли! ${choices[userChoice]} бьет ${choices[opponentChoice]}`;
      } else {
        resultMessage = `💥 ${opponentName} победил! ${choices[opponentChoice]} бьет ${choices[userChoice]}`;
      }

      document.getElementById('result-text').innerText = resultMessage;
    }
  </script>
</body>
</html>
