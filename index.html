<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Игра КНБ</title>

  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #1a1a1a;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 420px;

      margin: 20px auto;
      padding: 20px;

      background: #2a2a2a;
      border-radius: 16px;

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      text-align: center;
    }

    /* PROFILE */

    .profile-card {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 12px;

      margin-bottom: 20px;

      background: #1e1e1e;

      border: 1px solid #333;
      border-radius: 12px;

      text-align: left;
    }

    .profile-avatar {
      width: 54px;
      height: 54px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      background: #333;

      border: 2px solid #00ff88;

      display: block;
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 700;

      color: #fff;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-address {
      margin-top: 3px;

      font-family: monospace;
      font-size: 12px;

      color: #888;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-balance {
      margin-top: 5px;

      font-size: 14px;
      font-weight: 700;

      color: #00ff88;
    }

    /* ROOMS */

    .rooms {
      display: flex;
      gap: 10px;

      margin-bottom: 20px;
    }

    .room-btn {
      flex: 1;

      padding: 12px 8px;

      border: 2px solid #444;
      border-radius: 10px;

      background: #333;
      color: #fff;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      transition:
        background 0.2s,
        border-color 0.2s,
        transform 0.1s;
    }

    .room-btn:hover {
      background: #3d3d3d;
    }

    .room-btn:active {
      transform: scale(0.98);
    }

    .room-btn.active {
      border-color: #00ff88;
      background: #1e3a29;
    }

    /* GAME BUTTONS */

    .buttons {
      display: flex;
      justify-content: center;

      gap: 12px;

      margin: 25px 0;
    }

    .game-btn {
      width: 95px;
      height: 95px;

      padding: 10px;

      border: 2px solid #444;
      border-radius: 14px;

      background: #333;

      color: #fff;

      cursor: pointer;

      font-size: 42px;

      transition:
        transform 0.15s,
        background 0.2s,
        border-color 0.2s;
    }

    .game-btn:hover:not(:disabled) {
      background: #444;
      border-color: #00ff88;
      transform: translateY(-3px);
    }

    .game-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .game-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* RESULT */

    .result {
      min-height: 50px;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #202020;

      font-size: 16px;
      font-weight: 700;

      text-align: center;

      line-height: 1.4;
    }

    /* STATUS */

    #status {
      margin: 15px 0 0;

      color: #00ff88;

      font-size: 13px;

      text-align: center;
    }

    .error {
      color: #ff4444 !important;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🪨 ✂️ 📄 КНБ</h1>

    <!-- PROFILE -->

    <div class="profile-card">

      <img
        id="user-avatar"
        class="profile-avatar"
        alt="Аватар"
      >

      <div class="profile-info">

        <div
          id="user-name"
          class="profile-name"
        >
          Загрузка...
        </div>

        <div
          id="user-address"
          class="profile-address"
        >
          Адрес: --
        </div>

        <div
          id="user-balance"
          class="profile-balance"
        >
          0.0000 PKOIN
        </div>

      </div>

    </div>

    <!-- ROOMS -->

    <div class="rooms">

      <button
        class="room-btn active"
        id="mode-demo"
        onclick="selectRoom('demo')"
      >
        🤖 Бесплатная
      </button>

      <button
        class="room-btn"
        id="mode-pvp"
        onclick="selectRoom('pvp')"
      >
        ⚔️ 1 PKOIN
      </button>

    </div>

    <!-- GAME -->

    <div class="buttons">

      <button
        class="game-btn"
        id="btn-rock"
        onclick="makeMove('rock')"
        disabled
        title="Камень"
      >
        🪨
      </button>

      <button
        class="game-btn"
        id="btn-scissors"
        onclick="makeMove('scissors')"
        disabled
        title="Ножницы"
      >
        ✂️
      </button>

      <button
        class="game-btn"
        id="btn-paper"
        onclick="makeMove('paper')"
        disabled
        title="Бумага"
      >
        📄
      </button>

    </div>

    <div
      class="result"
      id="result-text"
    >
      Выберите режим и сделайте ваш ход!
    </div>

    <p id="status">
      Запуск Bastyon SDK...
    </p>

  </div>


  <script>

    let sdk = null;

    let userAddress = null;

    let currentRoom = 'demo';


    const BANK_ADDRESS =
      'PQoPdcQdkqQSqiHxPfsMwnhxW8QAjfTEzs';


    const DEFAULT_AVATAR =
      "data:image/svg+xml;utf8," +
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
      "<circle cx='50' cy='50' r='50' fill='%23333333'/>" +
      "<circle cx='50' cy='38' r='18' fill='%23888888'/>" +
      "<path d='M20 90c4-22 18-32 30-32s26 10 30 32' fill='%23888888'/>" +
      "</svg>";


    const choices = {

      rock: '🪨 Камень',

      scissors: '✂️ Ножницы',

      paper: '📄 Бумага'

    };


    /*
     * ----------------------------------------------------
     * КНОПКИ
     * ----------------------------------------------------
     */

    function enableButtons(enable) {

      const ids = [
        'btn-rock',
        'btn-scissors',
        'btn-paper'
      ];

      ids.forEach(id => {

        const btn =
          document.getElementById(id);

        if (btn) {

          btn.disabled = !enable;

        }

      });

    }


    /*
     * ----------------------------------------------------
     * ВЫБОР КОМНАТЫ
     * ----------------------------------------------------
     */

    function selectRoom(room) {

      currentRoom = room;

      document
        .getElementById('mode-demo')
        .classList.toggle(
          'active',
          room === 'demo'
        );

      document
        .getElementById('mode-pvp')
        .classList.toggle(
          'active',
          room === 'pvp'
        );


      const result =
        document.getElementById(
          'result-text'
        );


      if (room === 'demo') {

        result.innerText =
          'Бесплатная игра с компьютером.';

      } else {

        result.innerText =
          'Игра между игроками — ставка 1 PKOIN.';

      }

    }


    /*
     * ----------------------------------------------------
     * ПРОФИЛЬ BASTYON
     * ----------------------------------------------------
     */

    async function loadProfileInfo(address) {

      const avatarImg =
        document.getElementById(
          'user-avatar'
        );

      const nameEl =
        document.getElementById(
          'user-name'
        );


      if (!address || !sdk) {

        return;

      }


      avatarImg.src =
        DEFAULT_AVATAR;


      try {

        let profile = null;


        /*
         * Получаем профиль через RPC.
         */

        if (
          typeof sdk.rpc === 'function'
        ) {

          try {

            const res =
              await sdk.rpc(
                'getuserprofile',
                {
                  address: address,
                  shortForm: 'basic'
                }
              );


            profile =
              Array.isArray(res)
                ? res[0]
                : res;


            console.log(
              'BASTYON PROFILE:',
              profile
            );

          } catch (rpcError) {

            console.warn(
              'RPC profile error:',
              rpcError
            );

          }

        }


        /*
         * Имя пользователя
         */

        if (profile) {

          const name =
            profile.name ||
            profile.pName ||
            profile.nickname ||
            profile.username;


          if (
            name &&
            typeof name === 'string' &&
            name.trim()
          ) {

            nameEl.innerText =
              name.trim();

          } else {

            nameEl.innerText =
              'Игрок ' +
              address.slice(0, 6);

          }


          /*
           * Аватар
           */

          const avatar =
            profile.i ||
            profile.avatar ||
            profile.image ||
            profile.avatarUrl ||
            profile.imageUrl;


          if (
            avatar &&
            typeof avatar === 'string'
          ) {

            let avatarUrl =
              avatar.trim();


            if (
              !avatarUrl.startsWith('http')
            ) {

              avatarUrl =
                'https://pocketnet.app/ipfs/' +
                avatarUrl.replace(
                  /^\/+/,
                  ''
                );

            }


            avatarImg.src =
              avatarUrl;


            avatarImg.onerror =
              function () {

                console.warn(
                  'Не удалось загрузить аватар:',
                  avatarUrl
                );

                avatarImg.src =
                  DEFAULT_AVATAR;

              };

          }

        } else {

          nameEl.innerText =
            'Игрок ' +
            address.slice(0, 6);

        }


      } catch (error) {

        console.error(
          'Ошибка загрузки профиля:',
          error
        );


        nameEl.innerText =
          'Игрок ' +
          address.slice(0, 6);


        avatarImg.src =
          DEFAULT_AVATAR;

      }

    }


    /*
     * ----------------------------------------------------
     * АККАУНТ BASTYON
     * ----------------------------------------------------
     */

    async function loadBastyonUserData() {

      try {

        /*
         * Получаем адрес пользователя
         */

        if (
          sdk.get &&
          typeof sdk.get.account === 'function'
        ) {

          const account =
            await sdk.get.account();


          console.log(
            'BASTYON ACCOUNT:',
            account
          );


          if (account) {

            userAddress =
              typeof account === 'string'
                ? account
                : (
                    account.address ||
                    account.addr
                  );

          }

        }


        /*
         * Показываем адрес
         */

        if (userAddress) {

          document
            .getElementById(
              'user-address'
            )
            .innerText =
              userAddress.slice(0, 6) +
              '...' +
              userAddress.slice(-4);


          /*
           * Загружаем имя + аватар
           */

          await loadProfileInfo(
            userAddress
          );

        } else {

          document
            .getElementById(
              'user-address'
            )
            .innerText =
              'Адрес: Гость';

        }


        /*
         * Получаем баланс
         */

        if (
          sdk.get &&
          typeof sdk.get.balance === 'function'
        ) {

          try {

            const balance =
              await sdk.get.balance();


            console.log(
              'BASTYON BALANCE:',
              balance
            );


            let cleanBalance = 0;


            if (
              typeof balance === 'object' &&
              balance !== null
            ) {

              cleanBalance =
                balance.balance ||
                balance.confirmed ||
                0;

            } else {

              cleanBalance =
                parseFloat(balance) || 0;

            }


            document
              .getElementById(
                'user-balance'
              )
              .innerText =
                Number(cleanBalance)
                  .toFixed(4) +
                ' PKOIN';

          } catch (balanceError) {

            console.warn(
              'Ошибка баланса:',
              balanceError
            );

          }

        }

      } catch (error) {

        console.error(
          'Ошибка аккаунта:',
          error
        );

      }

    }


    /*
     * ----------------------------------------------------
     * ЗАПУСК BASTYON SDK
     * ----------------------------------------------------
     */

    document.addEventListener(
      'DOMContentLoaded',
      async function () {

        const status =
          document.getElementById(
            'status'
          );


        /*
         * Проверяем SDK
         */

        if (!window.BastyonSdk) {

          status.classList.add(
            'error'
          );

          status.innerText =
            '❌ SDK Bastyon не обнаружен';

          enableButtons(true);

          return;

        }


        try {

          /*
           * Создаём SDK
           */

          sdk =
            new window.BastyonSdk();


          /*
           * Инициализация
           */

          await sdk.init();


          /*
           * Запрашиваем права
           */

          if (
            sdk.permissions &&
            typeof sdk.permissions.request ===
              'function'
          ) {

            try {

              await sdk.permissions.request([
                'account',
                'payment',
                'rpc'
              ]);

            } catch (permissionError) {

              console.warn(
                'Ошибка permissions:',
                permissionError
              );

            }

          }


          /*
           * Загружаем аккаунт,
           * имя, аватар и баланс
           */

          await loadBastyonUserData();


          /*
           * Слушаем изменение баланса
           */

          if (
            typeof sdk.on === 'function'
          ) {

            sdk.on(
              'balance',
              function (newBalance) {

                let numberBalance = 0;


                if (
                  typeof newBalance ===
                    'object' &&
                  newBalance !== null
                ) {

                  numberBalance =
                    newBalance.balance || 0;

                } else {

                  numberBalance =
                    parseFloat(
                      newBalance
                    ) || 0;

                }


                document
                  .getElementById(
                    'user-balance'
                  )
                  .innerText =
                    Number(numberBalance)
                      .toFixed(4) +
                    ' PKOIN';

              }
            );

          }


          /*
           * Сообщаем Bastyon,
           * что приложение загружено
           */

          sdk.emit('loaded');


          status.innerText =
            '● Bastyon подключён';


          enableButtons(true);


        } catch (error) {

          console.error(
            'SDK ERROR:',
            error
          );


          status.classList.add(
            'error'
          );


          status.innerText =
            '❌ Ошибка SDK: ' +
            (
              error.message ||
              'Ошибка'
            );


          enableButtons(true);

        }

      }
    );


    /*
     * ----------------------------------------------------
     * ПЛАТЁЖ
     * ----------------------------------------------------
     */

    async function makePayment() {

      const paymentData = {

        address:
          BANK_ADDRESS,

        amount:
          1,

        currency:
          'PKOIN',

        comment:
          'Ставка в КНБ (1 PKOIN)'

      };


      if (
        sdk.payment &&
        typeof sdk.payment.make ===
          'function'
      ) {

        return await sdk.payment.make(
          paymentData
        );

      }


      if (
        sdk.payment &&
        typeof sdk.payment.request ===
          'function'
      ) {

        return await sdk.payment.request(
          paymentData
        );

      }


      if (
        typeof sdk.payment ===
          'function'
      ) {

        return await sdk.payment(
          paymentData
        );

      }


      throw new Error(
        'Метод оплаты недоступен'
      );

    }


    /*
     * ----------------------------------------------------
     * ХОД
     * ----------------------------------------------------
     */

    async function makeMove(
      userChoice
    ) {

      const result =
        document.getElementById(
          'result-text'
        );


      /*
       * PVP
       */

      if (
        currentRoom === 'pvp'
      ) {

        if (!sdk) {

          alert(
            'Запустите игру внутри Bastyon'
          );

          return;

        }


        enableButtons(false);


        result.innerText =
          '⏳ Подтвердите транзакцию 1 PKOIN...';


        try {

          const tx =
            await makePayment();


          if (
            !tx ||
            (!tx.id && !tx.txid)
          ) {

            throw new Error(
              'Транзакция отменена'
            );

          }


          result.innerText =
            'Ставка принята! Идет матч...';


          playPvpMatch(
            userChoice
          );


        } catch (error) {

          console.error(
            'Ошибка платежа:',
            error
          );


          result.innerText =
            '❌ Оплата не выполнена: ' +
            (
              error.message ||
              'Отменено'
            );


          enableButtons(true);

        }


        return;

      }


      /*
       * Бесплатная игра
       */

      playDemoMatch(
        userChoice
      );

    }


    /*
     * ----------------------------------------------------
     * ИГРА С БОТОМ
     * ----------------------------------------------------
     */

    function playDemoMatch(
      userChoice
    ) {

      const keys =
        Object.keys(
          choices
        );


      const botChoice =
        keys[
          Math.floor(
            Math.random() *
            keys.length
          )
        ];


      showResult(
        userChoice,
        botChoice,
        'Бот'
      );

    }


    /*
     * ----------------------------------------------------
     * PVP
     * ----------------------------------------------------
     *
     * Пока используется демонстрационный
     * соперник.
     *
     * Реальный серверный PVP подключим
     * следующим этапом.
     */

    function playPvpMatch(
      userChoice
    ) {

      setTimeout(
        function () {

          const keys =
            Object.keys(
              choices
            );


          const opponentChoice =
            keys[
              Math.floor(
                Math.random() *
                keys.length
              )
            ];


          showResult(
            userChoice,
            opponentChoice,
            'Соперник'
          );


          enableButtons(true);

        },
        1500
      );

    }


    /*
     * ----------------------------------------------------
     * РЕЗУЛЬТАТ
     * ----------------------------------------------------
     */

    function showResult(
      userChoice,
      opponentChoice,
      opponentName
    ) {

      let resultMessage = '';


      if (
        userChoice ===
        opponentChoice
      ) {

        resultMessage =
          'Ничья! Оба выбрали ' +
          choices[userChoice];

      }


      else if (

        (
          userChoice === 'rock' &&
          opponentChoice === 'scissors'
        )

        ||

        (
          userChoice === 'scissors' &&
          opponentChoice === 'paper'
        )

        ||

        (
          userChoice === 'paper' &&
          opponentChoice === 'rock'
        )

      ) {

        resultMessage =
          '🎉 Вы выиграли! ' +
          choices[userChoice] +
          ' бьет ' +
          choices[opponentChoice];

      }


      else {

        resultMessage =
          '💥 ' +
          opponentName +
          ' победил! ' +
          choices[opponentChoice] +
          ' бьет ' +
          choices[userChoice];

      }


      document
        .getElementById(
          'result-text'
        )
        .innerText =
          resultMessage;

    }

  </script>

</body>
</html>
