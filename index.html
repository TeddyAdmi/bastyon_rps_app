<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра КНБ</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    /* Профиль пользователя */
    .profile-card {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      gap: 12px;
      text-align: left;
    }
    .profile-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #333;
      border: 2px solid #00ff88;
    }
    .profile-info {
      flex: 1;
      overflow: hidden;
    }
    .profile-name {
      font-weight: bold;
      font-size: 1.05em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-address {
      font-size: 0.75em;
      color: #888;
      font-family: monospace;
      margin-top: 2px;
    }
    .profile-balance {
      font-size: 0.9em;
      font-weight: 600;
      color: #00ff88;
      margin-top: 4px;
    }

    .rooms { display: flex; gap: 10px; margin-bottom: 20px; }
    .room-btn {
      flex: 1; padding: 10px; border: 2px solid #444; border-radius: 8px;
      background: #333; color: white; cursor: pointer; font-weight: bold;
    }
    .room-btn.active { border-color: #00ff88; background: #1e3a29; }

    .buttons { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
    .game-btn {
      font-size: 2em; padding: 10px 15px; border: none; border-radius: 8px;
      background: #333; cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    .game-btn:hover { background: #444; transform: scale(1.05); }
    .game-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result { font-size: 1.1em; font-weight: bold; margin-top: 15px; min-height: 1.5em; }
    #status { color: #00ff88; font-size: 0.85em; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🪨 ✂️ 📄 Игра КНБ</h1>
    
    <!-- Профиль -->
    <div class="profile-card">
      <img id="user-avatar" class="profile-avatar" src="https://bastyon.com/images/user.png" alt="Avatar" />
      <div class="profile-info">
        <div id="user-name" class="profile-name">Загрузка...</div>
        <div id="user-address" class="profile-address">Адрес: --</div>
        <div id="user-balance" class="profile-balance">0.0000 PKOIN</div>
      </div>
    </div>

    <!-- Режимы -->
    <div class="rooms">
      <button class="room-btn active" id="mode-demo" onclick="selectRoom('demo')">🤖 Демо (0 PKOIN)</button>
      <button class="room-btn" id="mode-pvp" onclick="selectRoom('pvp')">⚔️ Игроки (1 PKOIN)</button>
    </div>

    <!-- Кнопки -->
    <div class="buttons">
      <button class="game-btn" onclick="makeMove('rock')" id="btn-rock" disabled>🪨</button>
      <button class="game-btn" onclick="makeMove('scissors')" id="btn-scissors" disabled>✂️</button>
      <button class="game-btn" onclick="makeMove('paper')" id="btn-paper" disabled>📄</button>
    </div>

    <div class="result" id="result-text">Выберите режим и сделайте ваш ход!</div>
    <p id="status">Инициализация Bastyon SDK...</p>
  </div>

  <script>
    let sdk = null;
    let userAddress = null;
    let currentRoom = 'demo';
    const BANK_ADDRESS = 'ВАШ_АДРЕС_КОШЕЛЬКА_ИЗ_BASTYON'; 
    const choices = { rock: '🪨 Камень', scissors: '✂️ Ножницы', paper: '📄 Бумага' };

    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      
      try {
        if (window.BastyonSdk) {
          sdk = new window.BastyonSdk();
          await sdk.init();
          
          let userInfo = null;

          // 1. Попытка запросить полные данные текущего пользователя приложения
          if (sdk.get && typeof sdk.get.appuserinfo === 'function') {
            try {
              userInfo = await sdk.get.appuserinfo();
            } catch (e) {
              console.log('appuserinfo не ответил:', e);
            }
          }

          // 2. Если appuserinfo не поддерживается, запрашиваем через getuserinfo/get.user
          if (!userInfo && sdk.get && typeof sdk.get.user === 'function') {
            try {
              userInfo = await sdk.get.user();
            } catch (e) {
              console.log('get.user не ответил:', e);
            }
          }

          // 3. Получаем данные кошелька (адрес и баланс)
          let accountData = null;
          if (sdk.get && typeof sdk.get.account === 'function') {
            try {
              accountData = await sdk.get.account();
            } catch (e) {
              console.log('account не ответил:', e);
            }
          }

          // Сводка данных
          const finalAddress = (userInfo && userInfo.address) || (accountData && accountData.address);
          const finalName = (userInfo && (userInfo.name || userInfo.nickname)) || (accountData && accountData.name);
          const finalAvatar = (userInfo && (userInfo.avatar || userInfo.image)) || (accountData && accountData.avatar);
          const finalBalance = (accountData && accountData.balance !== undefined) ? accountData.balance : (userInfo && userInfo.balance);

          // Заполнение адреса
          if (finalAddress) {
            userAddress = finalAddress;
            document.getElementById('user-address').innerText = `${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
          }

          // Заполнение имени
          if (finalName) {
            document.getElementById('user-name').innerText = finalName;
          } else if (userAddress) {
            // Если у пользователя нет установленного имени в профиле
            document.getElementById('user-name').innerText = `Пользователь ${userAddress.slice(0, 4)}`;
          }

          // Заполнение аватара
          if (finalAvatar) {
            document.getElementById('user-avatar').src = finalAvatar;
          }

          // Заполнение баланса
          if (finalBalance !== undefined && finalBalance !== null) {
            const numBal = parseFloat(finalBalance) || 0;
            document.getElementById('user-balance').innerText = `${numBal.toFixed(4)} PKOIN`;
          }

          // Если имя все еще не нашлось — запрашиваем профиль из сети напрямую по найденному адресу
          if (!finalName && userAddress && sdk.get && typeof sdk.get.getuserprofile === 'function') {
            try {
              const profiles = await sdk.get.getuserprofile([userAddress]);
              if (profiles && profiles.length > 0 && profiles[0].name) {
                document.getElementById('user-name').innerText = profiles[0].name;
                if (profiles[0].i) document.getElementById('user-avatar').src = profiles[0].i;
              }
            } catch (err) {
              console.warn('Не удалось загрузить публичный профиль:', err);
            }
          }

          sdk.emit('loaded');
          statusEl.innerText = '● Успешно подключено к Bastyon';
          enableButtons(true);

        } else {
          statusEl.style.color = '#ff4444';
          statusEl.innerText = 'Запущено вне Bastyon (Демо-режим)';
          document.getElementById('user-name').innerText = 'Тестовый Игрок';
          document.getElementById('user-balance').innerText = '10.0000 PKOIN';
          enableButtons(true);
        }
      } catch (e) {
        console.error('Ошибка инициализации:', e);
        statusEl.style.color = '#ff4444';
        statusEl.innerText = 'Ошибка SDK';
        enableButtons(true);
      }
    });

    function selectRoom(room) {
      currentRoom = room;
      document.getElementById('mode-demo').classList.toggle('active', room === 'demo');
      document.getElementById('mode-pvp').classList.toggle('active', room === 'pvp');
      
      const resultText = document.getElementById('result-text');
      resultText.innerText = (room === 'demo') ? 'Режим с Ботом: Бесплатная игра.' : 'Режим 1 PKOIN: Оплата при каждом ходе!';
    }

    function enableButtons(enable) {
      document.getElementById('btn-rock').disabled = !enable;
      document.getElementById('btn-scissors').disabled = !enable;
      document.getElementById('btn-paper').disabled = !enable;
    }

    async function makeMove(userChoice) {
      const resultEl = document.getElementById('result-text');

      if (currentRoom === 'pvp') {
        if (!sdk || !sdk.payment) {
          alert('Оплата доступна только внутри приложения Bastyon!');
          return;
        }

        enableButtons(false);
        resultEl.innerText = '⏳ Подтвердите транзакцию 1 PKOIN...';

        try {
          const tx = await sdk.payment.make({
            address: BANK_ADDRESS,
            amount: 1,
            currency: 'PKOIN',
            comment: 'Ставка в КНБ (1 PKOIN)'
          });

          if (!tx || !tx.id) throw new Error('Транзакция отменена');

          resultEl.innerText = 'Ставка принята! Идет матч...';
          playPvpMatch(userChoice);

        } catch (err) {
          console.error('Ошибка платежа:', err);
          resultEl.innerText = '❌ Оплата отменена или произошла ошибка.';
          enableButtons(true);
          return;
        }
      } else {
        playDemoMatch(userChoice);
      }
    }

    function playDemoMatch(userChoice) {
      const keys = Object.keys(choices);
      const botChoice = keys[Math.floor(Math.random() * keys.length)];
      showResult(userChoice, botChoice, 'Бот');
    }

    function playPvpMatch(userChoice) {
      setTimeout(() => {
        const keys = Object.keys(choices);
        const opponentChoice = keys[Math.floor(Math.random() * keys.length)];
        showResult(userChoice, opponentChoice, 'Соперник');
        enableButtons(true);
      }, 1500);
    }

    function showResult(userChoice, opponentChoice, opponentName) {
      let resultMessage = '';

      if (userChoice === opponentChoice) {
        resultMessage = `Ничья! Оба выбрали ${choices[userChoice]}`;
      } else if (
        (userChoice === 'rock' && opponentChoice === 'scissors') ||
        (userChoice === 'scissors' && opponentChoice === 'paper') ||
        (userChoice === 'paper' && opponentChoice === 'rock')
      ) {
        resultMessage = `🎉 Вы выиграли! ${choices[userChoice]} бьет ${choices[opponentChoice]}`;
      } else {
        resultMessage = `💥 ${opponentName} победил! ${choices[opponentChoice]} бьет ${choices[userChoice]}`;
      }

      document.getElementById('result-text').innerText = resultMessage;
    }
  </script>
</body>
</html>
