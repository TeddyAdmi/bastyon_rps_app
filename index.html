<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors PKOIN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }
    button {
      background: #ffaa00;
      border: none;
      padding: 10px 20px;
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="user-info">
      <img id="user-avatar" class="avatar" src="https://bastyon.com/images/user.png" alt="Avatar">
      <div>
        <div id="user-name">Загрузка...</div>
        <div id="user-balance">0 PKOIN</div>
      </div>
    </div>
    <h2>Камень Ножницы Бумага</h2>
    <button onclick="createPvpMatch()">Сделать ставку 1 PKOIN</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
