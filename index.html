<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра КНБ</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    /* Профиль пользователя */
    .profile-card {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      gap: 12px;
      text-align: left;
    }
    .profile-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #333;
      border: 2px solid #00ff88;
    }
    .profile-info {
      flex: 1;
      overflow: hidden;
    }
    .profile-name {
      font-weight: bold;
      font-size: 1.05em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-address {
      font-size: 0.75em;
      color: #888;
      font-family: monospace;
      margin-top: 2px;
    }
    .profile-balance {
      font-size: 0.9em;
      font-weight: 600;
      color: #00ff88;
      margin-top: 4px;
    }

    /* Комнаты */
    .rooms {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .room-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .room-btn.active {
      border-color: #00ff88;
      background: #1e3a29;
    }

    /* Кнопки хода */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .game-btn {
      font-size: 2em;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #333;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .game-btn:hover { background: #444; transform: scale(1.05); }
    .game-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result {
      font-size: 1.1em;
      font-weight: bold;
      margin-top: 15px;
      min-height: 1.5em;
    }
    #status { color: #00ff88; font-size: 0.85em; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🪨 ✂️ 📄 Игра КНБ</h1>
    
    <!-- Карточка профиля Bastyon -->
    <div class="profile-card">
      <img id="user-avatar" class="profile-avatar" src="https://bastyon.com/images/user.png" alt="Avatar" />
      <div class="profile-info">
        <div id="user-name" class="profile-name">Аноним</div>
        <div id="user-address" class="profile-address">Адрес: --</div>
        <div id="user-balance" class="profile-balance">0.0000 PKOIN</div>
      </div>
    </div>

    <!-- Выбор комнаты -->
    <div class="rooms">
      <button class="room-btn active" id="mode-demo" onclick="selectRoom('demo')">🤖 Демо (0 PKOIN)</button>
      <button class="room-btn" id="mode-pvp" onclick="selectRoom('pvp')">⚔️ Игроки (1 PKOIN)</button>
    </div>

    <!-- Игровое поле -->
    <div class="buttons">
      <button class="game-btn" onclick="makeMove('rock')" id="btn-rock" disabled>🪨</button>
      <button class="game-btn" onclick="makeMove('scissors')" id="btn-scissors" disabled>✂️</button>
      <button class="game-btn" onclick="makeMove('paper')" id="btn-paper" disabled>📄</button>
    </div>

    <div class="result" id="result-text">Выберите режим и сделайте ваш ход!</div>
    <p id="status">Загрузка Bastyon SDK...</p>
  </div>

  <script>
    let sdk = null;
    let userAddress = null;
    let currentRoom = 'demo';
    const BANK_ADDRESS = 'ВАШ_АДРЕС_КОШЕЛЬКА_ИЗ_BASTYON'; 
    const choices = { rock: '🪨 Камень', scissors: '✂️ Ножницы', paper: '📄 Бумага' };

    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      try {
        if (window.BastyonSdk) {
          sdk = new window.BastyonSdk();
          await sdk.init();
          
          // 1. Запрашиваем данные аккаунта
          if (sdk.get && typeof sdk.get.account === 'function') {
            const account = await sdk.get.account();
            console.log('Данные account:', account);
            
            if (account) {
              // Адрес
              if (account.address) {
                userAddress = account.address;
                document.getElementById('user-address').innerText = `${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
              }

              // Баланс с 4 знаками
              if (account.balance !== undefined && account.balance !== null) {
                const numericBalance = parseFloat(account.balance) || 0;
                document.getElementById('user-balance').innerText = `${numericBalance.toFixed(4)} PKOIN`;
              }

              // Имя из основного объекта account (если есть)
              let foundName = account.name || account.label || (account.user && account.user.name);
              let foundAvatar = account.avatar || account.image || (account.user && account.user.avatar);

              if (foundName) {
                document.getElementById('user-name').innerText = foundName;
              }
              if (foundAvatar) {
                document.getElementById('user-avatar').src = foundAvatar;
              }

              // 2. Если имени нет в account, запрашиваем профиль по адресу через getuserprofile
              if (!foundName && userAddress && typeof sdk.get.getuserprofile === 'function') {
                try {
                  const profiles = await sdk.get.getuserprofile([userAddress]);
                  console.log('Данные профиля:', profiles);
                  
                  if (profiles && profiles.length > 0) {
                    const profile = profiles[0];
                    if (profile.name) {
                      document.getElementById('user-name').innerText = profile.name;
                    }
                    if (profile.i) { // В Bastyon 'i' часто отвечает за иконку/аватар
                      document.getElementById('user-avatar').src = profile.i;
                    }
                  }
                } catch (pErr) {
                  console.warn('Не удалось получить getuserprofile:', pErr);
                }
              }

              // Если имя так и не нашли, но есть адрес — выводим сокращенный адрес вместо "Загрузка..."
              if (!foundName && document.getElementById('user-name').innerText === 'Аноним' && userAddress) {
                document.getElementById('user-name').innerText = `Игрок ${userAddress.slice(0, 6)}`;
              }
            }
          }

          sdk.emit('loaded');
          statusEl.innerText = '● Успешно подключено к Bastyon';
          enableButtons(true);
        } else {
          statusEl.style.color = '#ff4444';
          statusEl.innerText = 'Запущено вне Bastyon (Демо-режим)';
          document.getElementById('user-name').innerText = 'Тестовый Игрок';
          document.getElementById('user-balance').innerText = '10.0000 PKOIN';
          enableButtons(true);
        }
      } catch (e) {
        console.error('Ошибка SDK:', e);
        statusEl.style.color = '#ff4444';
        statusEl.innerText = 'Ошибка инициализации SDK';
        enableButtons(true);
      }
    });

    function selectRoom(room) {
      currentRoom = room;
      document.getElementById('mode-demo').classList.toggle('active', room === 'demo');
      document.getElementById('mode-pvp').classList.toggle('active', room === 'pvp');
      
      const resultText = document.getElementById('result-text');
      if (room === 'demo') {
        resultText.innerText = 'Режим с Ботом: Бесплатная игра.';
      } else {
        resultText.innerText = 'Режим 1 PKOIN: Оплата при каждом ходе!';
      }
    }

    function enableButtons(enable) {
      document.getElementById('btn-rock').disabled = !enable;
      document.getElementById('btn-scissors').disabled = !enable;
      document.getElementById('btn-paper').disabled = !enable;
    }

    async function makeMove(userChoice) {
      const resultEl = document.getElementById('result-text');

      if (currentRoom === 'pvp') {
        if (!sdk || !sdk.payment) {
          alert('Оплата доступна только внутри приложения Bastyon!');
          return;
        }

        enableButtons(false);
        resultEl.innerText = '⏳ Подтвердите транзакцию 1 PKOIN...';

        try {
          const tx = await sdk.payment.make({
            address: BANK_ADDRESS,
            amount: 1,
            currency: 'PKOIN',
            comment: 'Ставка в КНБ (1 PKOIN)'
          });

          if (!tx || !tx.id) throw new Error('Транзакция отменена');

          resultEl.innerText = 'Ставка принята! Идет матч...';
          playPvpMatch(userChoice);

        } catch (err) {
          console.error('Ошибка платежа:', err);
          resultEl.innerText = '❌ Оплата отменена или произошла ошибка.';
          enableButtons(true);
          return;
        }
      } else {
        playDemoMatch(userChoice);
      }
    }

    function playDemoMatch(userChoice) {
      const keys = Object.keys(choices);
      const botChoice = keys[Math.floor(Math.random() * keys.length)];
      showResult(userChoice, botChoice, 'Бот');
    }

    function playPvpMatch(userChoice) {
      setTimeout(() => {
        const keys = Object.keys(choices);
        const opponentChoice = keys[Math.floor(Math.random() * keys.length)];
        showResult(userChoice, opponentChoice, 'Соперник');
        enableButtons(true);
      }, 1500);
    }

    function showResult(userChoice, opponentChoice, opponentName) {
      let resultMessage = '';

      if (userChoice === opponentChoice) {
        resultMessage = `Ничья! Оба выбрали ${choices[userChoice]}`;
      } else if (
        (userChoice === 'rock' && opponentChoice === 'scissors') ||
        (userChoice === 'scissors' && opponentChoice === 'paper') ||
        (userChoice === 'paper' && opponentChoice === 'rock')
      ) {
        resultMessage = `🎉 Вы выиграли! ${choices[userChoice]} бьет ${choices[opponentChoice]}`;
      } else {
        resultMessage = `💥 ${opponentName} победил! ${choices[opponentChoice]} бьет ${choices[userChoice]}`;
      }

      document.getElementById('result-text').innerText = resultMessage;
    }
  </script>
</body>
</html>
