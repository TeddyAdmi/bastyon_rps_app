  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #1a1a1a;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 420px;

      margin: 20px auto;
      padding: 20px;

      background: #2a2a2a;

      border-radius: 16px;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      text-align: center;
    }

    /* PROFILE */

    .profile-card {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 12px;
      margin-bottom: 20px;

      background: #1e1e1e;

      border: 1px solid #333;
      border-radius: 12px;
    }

    .profile-avatar {
      width: 54px;
      height: 54px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      background: #333;

      border: 2px solid #00ff88;

      display: block;
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 700;

      color: #fff;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-address {
      margin-top: 3px;

      font-family: monospace;

      font-size: 12px;

      color: #888;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-balance {
      margin-top: 5px;

      font-size: 14px;
      font-weight: 700;

      color: #00ff88;
    }

    /* ROOMS */

    .rooms {
      display: flex;
      gap: 10px;

      margin-bottom: 20px;
    }

    .room-btn {
      flex: 1;

      padding: 12px 8px;

      border: 2px solid #444;
      border-radius: 10px;

      background: #333;

      color: #fff;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      transition:
        background 0.2s,
        border-color 0.2s,
        transform 0.1s;
    }

    .room-btn:hover {
      background: #3d3d3d;
    }

    .room-btn:active {
      transform: scale(0.98);
    }

    .room-btn.active {
      border-color: #00ff88;
      background: #1e3a29;
    }

    /* GAME BUTTONS */

    .buttons {
      display: flex;

      justify-content: center;

      gap: 12px;

      margin: 25px 0;
    }

    .game-btn {
      width: 95px;
      height: 95px;

      padding: 10px;

      border: 2px solid #444;
      border-radius: 14px;

      background: #333;

      color: #fff;

      cursor: pointer;

      font-size: 42px;

      transition:
        transform 0.15s,
        background 0.2s,
        border-color 0.2s;
    }

    .game-btn:hover:not(:disabled) {
      background: #444;
      border-color: #00ff88;

      transform: translateY(-3px);
    }

    .game-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .game-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* RESULT */

    .result {
      min-height: 50px;

      margin-top: 15px;
      padding: 12px;

      border-radius: 10px;

      background: #202020;

      font-size: 16px;
      font-weight: 700;

      text-align: center;

      line-height: 1.4;
    }

    /* STATUS */

    #status {
      margin: 15px 0 0;

      color: #00ff88;

      font-size: 13px;

      text-align: center;
    }

    .error {
      color: #ff4444 !important;
    }

    .warning {
      color: #ffaa00 !important;
    }
  </style>

</head>

  </div>

  <script>

    /* ====================================================
       ГЛОБАЛЬНЫЕ ДАННЫЕ
       ==================================================== */

    let sdk = null;

    let userAddress = null;

    let currentRoom = 'demo';


    /* ====================================================
       АВАТАР ПО УМОЛЧАНИЮ
       ==================================================== */

    const DEFAULT_AVATAR =
      "data:image/svg+xml;utf8," +
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
      "<circle cx='50' cy='50' r='50' fill='%23333333'/>" +
      "<circle cx='50' cy='38' r='18' fill='%23888888'/>" +
      "<path d='M20 90c4-22 18-32 30-32s26 10 30 32' fill='%23888888'/>" +
      "</svg>";


    /* ====================================================
       ВАРИАНТЫ КНБ
       ==================================================== */

    const choices = {

      rock: '🪨 Камень',

      scissors: '✂️ Ножницы',

      paper: '📄 Бумага'

    };


    /* ====================================================
       КНОПКИ
       ==================================================== */

    function enableButtons(enable) {

      const ids = [
        'btn-rock',
        'btn-scissors',
        'btn-paper'
      ];

      ids.forEach(function(id) {

        const button =
          document.getElementById(id);

        if (button) {

          button.disabled = !enable;

        }

      });

    }


    /* ====================================================
       КОМНАТА
       ==================================================== */

    function selectRoom(room) {

      currentRoom = room;

      document
        .getElementById('mode-demo')
        .classList.toggle(
          'active',
          room === 'demo'
        );

      document
        .getElementById('mode-pvp')
        .classList.toggle(
          'active',
          room === 'pvp'
        );

      const result =
        document.getElementById('result-text');

      if (room === 'demo') {

        result.innerText =
          'Бесплатная игра с компьютером.';

      } else {

        result.innerText =
          'Игра между игроками — ставка 1 PKOIN.';

      }

    }


    /* ====================================================
       СОКРАЩЁННЫЙ АДРЕС
       ==================================================== */

    function shortAddress(address) {

      if (!address) {

        return 'Адрес: --';

      }

      const text =
        String(address);

      if (text.length <= 12) {

        return text;

      }

      return (
        text.slice(0, 6) +
        '...' +
        text.slice(-4)
      );

    }


    /* ====================================================
       ПОКАЗ АДРЕСА
       ==================================================== */

    function showAddress(address) {

      const element =
        document.getElementById(
          'user-address'
        );

      if (!element) {

        return;

      }

      if (address) {

        element.innerText =
          shortAddress(address);

      } else {

        element.innerText =
          'Адрес: не определён';

      }

    }


    /* ====================================================
       ПОЛУЧЕНИЕ БАЛАНСА
       ====================================================
       
       ВАЖНО:
       Bastyon SDK сейчас возвращает:

       {
         total: 0.20059996,
         actual: 0.20059996,
         tempbalance: 0
       }

       Поэтому сначала проверяем:
       actual
       total
       balance
       confirmed
       available
       amount
       ==================================================== */

    function findBalanceValue(
      object,
      path = ''
    ) {

      if (
        object === null ||
        object === undefined
      ) {

        return null;

      }


      /* Число */

      if (
        typeof object === 'number' &&
        Number.isFinite(object)
      ) {

        return {

          value: object,

          path: path || 'number'

        };

      }


      /* Строка с числом */

      if (
        typeof object === 'string' &&
        object.trim() !== ''
      ) {

        const number =
          Number(object);

        if (
          Number.isFinite(number)
        ) {

          return {

            value: number,

            path: path || 'string'

          };

        }

      }


      /* Только объекты */

      if (
        typeof object !== 'object'
      ) {

        return null;

      }


      /*
       * ПРИОРИТЕТНЫЕ ПОЛЯ BASTYON
       *
       * actual и total идут первыми,
       * потому что именно их сейчас
       * возвращает sdk.get.balance()
       */

      const priorityKeys = [

        'actual',

        'total',

        'balance',

        'confirmed',

        'available',

        'amount',

        'pkoin',

        'PKOIN',

        'value'

      ];


      for (
        const key of priorityKeys
      ) {

        if (
          !Object.prototype.hasOwnProperty.call(
            object,
            key
          )
        ) {

          continue;

        }


        const value =
          object[key];


        /*
         * Число
         */

        if (
          typeof value === 'number' &&
          Number.isFinite(value)
        ) {

          return {

            value: value,

            path:
              path
                ? path + '.' + key
                : key

          };

        }


        /*
         * Строка
         */

        if (
          typeof value === 'string' &&
          value.trim() !== ''
        ) {

          const number =
            Number(value);

          if (
            Number.isFinite(number)
          ) {

            return {

              value: number,

              path:
                path
                  ? path + '.' + key
                  : key

            };

          }

        }

      }


      /*
       * Ищем вложенные объекты
       */

      for (
        const key of Object.keys(object)
      ) {

        const value =
          object[key];

        if (
          value &&
          typeof value === 'object'
        ) {

          const result =
            findBalanceValue(
              value,
              path
                ? path + '.' + key
                : key
            );

          if (result) {

            return result;

          }

        }

      }


      return null;

    }


    /* ====================================================
       ПОКАЗ БАЛАНСА
       ==================================================== */

    function showBalance(
      balanceData
    ) {

      const element =
        document.getElementById(
          'user-balance'
        );

      if (!element) {

        return;

      }


      console.log(
        'BASTYON BALANCE DATA:',
        balanceData
      );


      const found =
        findBalanceValue(
          balanceData
        );


      console.log(
        'BALANCE SEARCH RESULT:',
        found
      );


      if (!found) {

        element.innerText =
          'Баланс недоступен';

        element.classList.add(
          'warning'
        );

        return;

      }


      const number =
        Number(found.value);


      if (
        !Number.isFinite(number)
      ) {

        element.innerText =
          'Баланс недоступен';

        element.classList.add(
          'warning'
        );

        return;

      }


      /*
       * Показываем 4 знака после запятой.
       *
       * 0.20059996
       *       ↓
       * 0.2006 PKOIN
       */

      element.innerText =
        number.toFixed(4) +
        ' PKOIN';


      element.classList.remove(
        'warning'
      );

    }


    /* ====================================================
       ПРОФИЛЬ
       ==================================================== */

    async function loadProfileInfo(
      address
    ) {

      const avatarImg =
        document.getElementById(
          'user-avatar'
        );

      const nameEl =
        document.getElementById(
          'user-name'
        );


      if (!address) {

        nameEl.innerText =
          'Гость';

        avatarImg.src =
          DEFAULT_AVATAR;

        return;

      }


      avatarImg.src =
        DEFAULT_AVATAR;


      /*
       * Пока используем RPC только для
       * получения профиля.
       *
       * Ошибка RPC не мешает загрузке
       * аккаунта и баланса.
       */

      try {

        let profile = null;


        if (
          sdk &&
          typeof sdk.rpc === 'function'
        ) {

          try {

            const response =
              await sdk.rpc(
                'getuserprofile',
                {
                  address: address,
                  shortForm: 'basic'
                }
              );


            console.log(
              'BASTYON PROFILE RAW:',
              response
            );


            profile =
              Array.isArray(response)
                ? response[0]
                : response;


          } catch (error) {

            console.warn(
              'PROFILE RPC ERROR:',
              error
            );

          }

        }


        if (profile) {

          const name =
            profile.name ||
            profile.pName ||
            profile.nickname ||
            profile.username ||
            profile.displayName;


          if (
            name &&
            String(name).trim()
          ) {

            nameEl.innerText =
              String(name).trim();

          } else {

            nameEl.innerText =
              'Игрок ' +
              String(address).slice(0, 6);

          }


          const avatar =
            profile.i ||
            profile.avatar ||
            profile.image ||
            profile.avatarUrl ||
            profile.imageUrl;


          if (
            avatar &&
            typeof avatar === 'string'
          ) {

            let avatarUrl =
              avatar.trim();


            if (
              avatarUrl.startsWith('//')
            ) {

              avatarUrl =
                'https:' +
                avatarUrl;

            }


            if (
              !/^https?:\/\//i.test(
                avatarUrl
              ) &&
              !avatarUrl.startsWith('data:')
            ) {

              avatarUrl =
                'https://pocketnet.app/ipfs/' +
                avatarUrl.replace(
                  /^\/+/,
                  ''
                );

            }


            avatarImg.src =
              avatarUrl;


            avatarImg.onerror =
              function() {

                console.warn(
                  'Аватар не загрузился:',
                  avatarUrl
                );

                avatarImg.src =
                  DEFAULT_AVATAR;

              };

          }

        } else {

          nameEl.innerText =
            'Игрок ' +
            String(address).slice(0, 6);

        }


      } catch (error) {

        console.error(
          'PROFILE ERROR:',
          error
        );


        nameEl.innerText =
          'Игрок ' +
          String(address).slice(0, 6);


        avatarImg.src =
          DEFAULT_AVATAR;

      }

    }


    /* ====================================================
       ПОЛУЧЕНИЕ АККАУНТА
       ==================================================== */

    async function getAccount() {

      if (
        !sdk ||
        !sdk.get ||
        typeof sdk.get.account !== 'function'
      ) {

        return null;

      }


      try {

        const account =
          await sdk.get.account();


        console.log(
          'BASTYON ACCOUNT RAW:',
          account
        );


        if (
          typeof account === 'string'
        ) {

          return account;

        }


        if (
          account &&
          typeof account === 'object'
        ) {

          return (
            account.address ||
            account.addr ||
            account.id ||
            account.userId ||
            null
          );

        }

      } catch (error) {

        console.error(
          'ACCOUNT ERROR:',
          error
        );

      }


      return null;

    }


    /* ====================================================
       ПОЛУЧЕНИЕ БАЛАНСА
       ==================================================== */

    async function getBalance() {

      if (
        !sdk ||
        !sdk.get ||
        typeof sdk.get.balance !== 'function'
      ) {

        console.warn(
          'sdk.get.balance отсутствует'
        );

        return null;

      }


      try {

        const balance =
          await sdk.get.balance();


        console.log(
          'BASTYON BALANCE RAW:',
          balance
        );


        return balance;

      } catch (error) {

        console.error(
          'BALANCE ERROR:',
          error
        );

        return null;

      }

    }


    /* ====================================================
       ЗАГРУЗКА ДАННЫХ BASTYON
       ==================================================== */

    async function loadBastyonUserData() {

      /*
       * ACCOUNT
       */

      userAddress =
        await getAccount();


      /*
       * ADDRESS
       */

      showAddress(
        userAddress
      );


      /*
       * PROFILE
       */

      if (userAddress) {

        await loadProfileInfo(
          userAddress
        );

      } else {

        document
          .getElementById('user-name')
          .innerText =
            'Гость';

      }


      /*
       * BALANCE
       */

      const balanceData =
        await getBalance();


      if (
        balanceData !== null
      ) {

        showBalance(
          balanceData
        );

      } else {

        const balanceElement =
          document.getElementById(
            'user-balance'
          );

        balanceElement.innerText =
          'Баланс недоступен';

        balanceElement.classList.add(
          'warning'
        );

      }


      /*
       * USERSTATE
       */

      if (
        sdk &&
        sdk.helpers &&
        typeof sdk.helpers.userstate === 'function'
      ) {

        try {

          const state =
            await sdk.helpers.userstate();


          console.log(
            'BASTYON USERSTATE RAW:',
            state
          );


          const nameElement =
            document.getElementById(
              'user-name'
            );


          const currentName =
            nameElement.innerText;


          if (
            !currentName ||
            currentName === 'Загрузка...' ||
            currentName === 'Гость'
          ) {

            const profile =
              state?.profile ||
              state?.user ||
              state?.account ||
              state;


            const name =
              profile?.name ||
              profile?.pName ||
              profile?.nickname ||
              profile?.username;


            if (name) {

              nameElement.innerText =
                String(name);

            }

          }

        } catch (error) {

          console.warn(
            'USERSTATE ERROR:',
            error
          );

        }

      }

    }


    /* ====================================================
       ИНИЦИАЛИЗАЦИЯ
       ==================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      async function() {

        const status =
          document.getElementById(
            'status'
          );


        /*
         * SDK
         */

        if (!window.BastyonSdk) {

          status.classList.add(
            'error'
          );

          status.innerText =
            '❌ SDK Bastyon не обнаружен';

          enableButtons(true);

          return;

        }


        try {

          /*
           * СОЗДАНИЕ SDK
           */

          sdk =
            new window.BastyonSdk();


          /*
           * INIT
           */

          if (
            typeof sdk.init === 'function'
          ) {

            await sdk.init();

          }


          /*
           * РАЗРЕШЕНИЯ
           */

          if (
            sdk.permissions &&
            typeof sdk.permissions.request === 'function'
          ) {

            try {

              await sdk.permissions.request([
                'account',
                'payment',
                'rpc'
              ]);

            } catch (error) {

              console.warn(
                'PERMISSIONS ERROR:',
                error
              );

            }

          }


          /*
           * ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
           */

          await loadBastyonUserData();


          /*
           * СОБЫТИЕ ИЗМЕНЕНИЯ БАЛАНСА
           */

          if (
            typeof sdk.on === 'function'
          ) {

            sdk.on(
              'balance',
              function(newBalance) {

                console.log(
                  'BASTYON BALANCE EVENT:',
                  newBalance
                );


                showBalance(
                  newBalance
                );

              }
            );

          }


          /*
           * LOADED
           */

          if (
            typeof sdk.emit === 'function'
          ) {

            sdk.emit(
              'loaded'
            );

          }


          /*
           * STATUS
           */

          status.classList.remove(
            'error'
          );


          status.innerText =
            '● Bastyon подключён';


          /*
           * GAME
           */

          enableButtons(true);


        } catch (error) {

          console.error(
            'SDK ERROR:',
            error
          );


          status.classList.add(
            'error'
          );


          status.innerText =
            '❌ Ошибка SDK: ' +
            (
              error.message ||
              'Ошибка'
            );


          enableButtons(true);

        }

      }
    );


    /* ====================================================
       DEMO GAME
       ==================================================== */

    function playDemoMatch(
      userChoice
    ) {

      const keys =
        Object.keys(
          choices
        );


      const botChoice =
        keys[
          Math.floor(
            Math.random() *
            keys.length
          )
        ];


      showResult(
        userChoice,
        botChoice,
        'Бот'
      );

    }


    /* ====================================================
       PVP
       ==================================================== */

    async function playPvpMatch(
      userChoice
    ) {

      const result =
        document.getElementById(
          'result-text'
        );


      result.innerText =
        '⏳ Подключение к PvP...';


      try {

        const response =
          await fetch(
            '/api/pvp/join',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({

                userId:
                  userAddress ||
                  'demo-user',

                nickname:
                  document.getElementById(
                    'user-name'
                  ).innerText

              })

            }
          );


        const text =
          await response.text();


        let data = null;


        try {

          data =
            JSON.parse(text);

        } catch (error) {

          console.warn(
            'PVP returned non-JSON:',
            text
          );

        }


        if (
          !response.ok
        ) {

          result.innerText =
            '❌ PvP API: ' +
            response.status;


          enableButtons(true);

          return;

        }


        if (
          data &&
          data.room
        ) {

          result.innerText =
            'Комната создана. Ожидание соперника...';

        } else {

          result.innerText =
            'Комната PvP создана.';

        }


      } catch (error) {

        console.error(
          'PVP ERROR:',
          error
        );


        result.innerText =
          '❌ PvP сервер недоступен.';

      }


      enableButtons(true);

    }


    /* ====================================================
       ХОД
       ==================================================== */

    async function makeMove(
      userChoice
    ) {

      if (
        currentRoom === 'demo'
      ) {

        playDemoMatch(
          userChoice
        );

        return;

      }


      await playPvpMatch(
        userChoice
      );

    }


    /* ====================================================
       РЕЗУЛЬТАТ
       ==================================================== */

    function showResult(
      userChoice,
      opponentChoice,
      opponentName
    ) {

      let resultMessage =
        '';


      /*
       * НИЧЬЯ
       */

      if (
        userChoice === opponentChoice
      ) {

        resultMessage =
          'Ничья! Оба выбрали ' +
          choices[userChoice];

      }


      /*
       * ПОБЕДА
       */

      else if (

        (
          userChoice === 'rock' &&
          opponentChoice === 'scissors'
        )

        ||

        (
          userChoice === 'scissors' &&
          opponentChoice === 'paper'
        )

        ||

        (
          userChoice === 'paper' &&
          opponentChoice === 'rock'
        )

      ) {

        resultMessage =
          '🎉 Вы выиграли! ' +
          choices[userChoice] +
          ' бьет ' +
          choices[opponentChoice];

      }


      /*
       * ПОРАЖЕНИЕ
       */

      else {

        resultMessage =
          '💥 ' +
          opponentName +
          ' победил! ' +
          choices[opponentChoice] +
          ' бьет ' +
          choices[userChoice];

      }


      document
        .getElementById(
          'result-text'
        )
        .innerText =
          resultMessage;

    }

  </script>
