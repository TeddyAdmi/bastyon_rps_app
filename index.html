<script>

let sdk = null;
let account = null;
let balance = null;

async function initBastyon() {

    console.log("========== BASTYON START ==========");

    try {

        sdk = new BastyonSdk();

        await sdk.init();

        console.log("BASTYON SDK INITIALIZED");

        sdk.emit("loaded");

        account = await sdk.get.account();

        console.log("BASTYON ACCOUNT:", account);

        if (account && account.address) {

            document.getElementById("profileAddress").textContent =
                account.address;

            document.getElementById("profileName").textContent =
                "Игрок " + account.address.substring(0, 6);

        }

        balance = await sdk.get.balance();

        console.log("BASTYON BALANCE:", balance);

        if (balance) {

            const amount =
                Number(balance.actual ?? balance.total ?? 0);

            document.getElementById("profileBalance").textContent =
                amount.toFixed(4) + " PKOIN";

        }

        if (
            account &&
            account.address &&
            typeof sdk.rpc === "function"
        ) {

            try {

                const userState = await sdk.rpc(
                    "getuserstate",
                    [
                        account.address
                    ],
                    {
                        cachetime: 0
                    }
                );

                console.log(
                    "USER STATE RESULT:",
                    userState
                );

            } catch (stateError) {

                console.error(
                    "USER STATE ERROR:",
                    stateError
                );

            }

        }

        document.getElementById("status").textContent =
            "Bastyon подключён";

        console.log("========== BASTYON READY ==========");

    } catch (error) {

        console.error(
            "BASTYON ERROR:",
            error
        );

        document.getElementById("status").textContent =
            "Ошибка подключения Bastyon";

    }

}

function play(playerChoice) {

    const choices = [
        "rock",
        "scissors",
        "paper"
    ];

    const computerChoice =
        choices[
            Math.floor(
                Math.random() * choices.length
            )
        ];

    let result = "";

    if (playerChoice === computerChoice) {

        result = "Ничья 🤝";

    } else if (

        (playerChoice === "rock" &&
         computerChoice === "scissors") ||

        (playerChoice === "scissors" &&
         computerChoice === "paper") ||

        (playerChoice === "paper" &&
         computerChoice === "rock")

    ) {

        result = "Вы выиграли! 🎉";

    } else {

        result = "Вы проиграли";

    }

    document.getElementById("result").innerHTML =
        "Ваш ход: <b>" +
        playerChoice +
        "</b><br>" +
        "Ход компьютера: <b>" +
        computerChoice +
        "</b><br><br>" +
        result;

}

initBastyon();

</script>
