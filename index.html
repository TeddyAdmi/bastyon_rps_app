<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КНБ — Bastyon</title>

    <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1f2937;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            background: #374151;
        }

        .profile-info {
            min-width: 0;
            flex: 1;
        }

        .profile-name {
            font-size: 18px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .profile-address {
            margin-top: 4px;
            font-size: 12px;
            color: #9ca3af;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .balance {
            margin-left: auto;
            font-size: 14px;
            white-space: nowrap;
        }

        .title {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .choices {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .choice {
            flex: 1;
            border: 0;
            border-radius: 18px;
            padding: 20px 10px;
            background: #1f2937;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .choice:hover {
            background: #374151;
        }

        .choice-image {
            font-size: 42px;
            display: block;
            margin-bottom: 8px;
        }

        .result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 18px;
            background: #1f2937;
            text-align: center;
            min-height: 60px;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            color: #6ee7b7;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="profile">

        <img
            id="avatar"
            class="avatar"
            src="https://i.imgur.com/6VBx3io.png"
            alt="Avatar"
        >

        <div class="profile-info">

            <div id="profileName" class="profile-name">
                Подключение...
            </div>

            <div id="profileAddress" class="profile-address">
                ...
            </div>

        </div>

        <div id="profileBalance" class="balance">
            0 PKOIN
        </div>

    </div>

    <div class="title">
        КНБ
    </div>

    <div class="subtitle">
        Камень • Ножницы • Бумага
    </div>

    <div class="choices">

        <button class="choice" onclick="play('rock')">
            <span class="choice-image">🪨</span>
            Камень
        </button>

        <button class="choice" onclick="play('scissors')">
            <span class="choice-image">✂️</span>
            Ножницы
        </button>

        <button class="choice" onclick="play('paper')">
            <span class="choice-image">📄</span>
            Бумага
        </button>

    </div>

    <div id="result" class="result">
        Сделайте ход
    </div>

    <div id="status" class="status">
        Подключение к Bastyon...
    </div>

</div>

<script>

let sdk = null;
let account = null;
let balance = null;


/* =========================================
   BASTYON
========================================= */

async function initBastyon() {

    try {

        sdk = new BastyonSdk();

        await sdk.init();

        sdk.emit("loaded");

        /* ACCOUNT */

        account = await sdk.get.account();

        if (account && account.address) {

            document.getElementById("profileAddress").textContent =
                account.address;

            document.getElementById("profileName").textContent =
                "Игрок " + account.address.substring(0, 6);

        }


        /* BALANCE */

        balance = await sdk.get.balance();

        if (balance) {

            document.getElementById("profileBalance").textContent =
                Number(
                    balance.actual ||
                    balance.total ||
                    0
                ).toFixed(4) + " PKOIN";

        }


        /* PROFILE */

        if (
            account &&
            account.address &&
            typeof sdk.rpc === "function"
        ) {

            try {

                const profile = await sdk.rpc(
                    "getuserprofile",
                    {
                        address: account.address,
                        shortForm: "basic"
                    }
                );

                console.log(
                    "PROFILE RESULT:",
                    profile
                );


                const data =
                    profile?.data ||
                    profile?.result ||
                    profile;


                if (data) {

                    const name =
                        data.name ||
                        data.nickname ||
                        data.nick ||
                        data.username;


                    const avatar =
                        data.avatar ||
                        data.image ||
                        data.avatarurl ||
                        data.avatarUrl;


                    if (name) {

                        document.getElementById(
                            "profileName"
                        ).textContent = name;

                    }


                    if (avatar) {

                        document.getElementById(
                            "avatar"
                        ).src = avatar;

                    }

                }

            } catch (error) {

                console.log(
                    "PROFILE ERROR:",
                    error
                );

            }

        }


        document.getElementById("status").textContent =
            "Bastyon подключён";

    } catch (error) {

        console.error(
            "BASTYON ERROR:",
            error
        );

        document.getElementById("status").textContent =
            "Ошибка подключения Bastyon";

    }

}


/* =========================================
   GAME
========================================= */

function play(playerChoice) {

    const choices = [
        "rock",
        "scissors",
        "paper"
    ];

    const computerChoice =
        choices[
            Math.floor(
                Math.random() * choices.length
            )
        ];

    let result = "";


    if (playerChoice === computerChoice) {

        result = "Ничья 🤝";

    } else if (

        (playerChoice === "rock" &&
            computerChoice === "scissors") ||

        (playerChoice === "scissors" &&
            computerChoice === "paper") ||

        (playerChoice === "paper" &&
            computerChoice === "rock")

    ) {

        result = "Вы выиграли! 🎉";

    } else {

        result = "Вы проиграли";

    }


    document.getElementById("result").innerHTML =
        "Ваш ход: <b>" +
        playerChoice +
        "</b><br>" +

        "Ход компьютера: <b>" +
        computerChoice +
        "</b><br><br>" +

        result;

}


/* =========================================
   START
========================================= */

initBastyon();

</script>

</body>
</html>
