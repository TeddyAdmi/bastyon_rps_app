<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра КНБ</title>

  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }

    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .profile-card {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      gap: 12px;
      text-align: left;
    }

    .profile-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #333;
      border: 2px solid #00ff88;
    }

    .profile-info {
      flex: 1;
      overflow: hidden;
    }

    .profile-name {
      font-weight: bold;
      font-size: 1.05em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-address {
      font-size: 0.75em;
      color: #888;
      font-family: monospace;
      margin-top: 2px;
    }

    .profile-balance {
      font-size: 0.9em;
      font-weight: 600;
      color: #00ff88;
      margin-top: 4px;
    }

    .rooms {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .room-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .room-btn.active {
      border-color: #00ff88;
      background: #1e3a29;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .game-btn {
      font-size: 2em;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #333;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .game-btn:hover {
      background: #444;
      transform: scale(1.05);
    }

    .game-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result {
      font-size: 1.1em;
      font-weight: bold;
      margin-top: 15px;
      min-height: 1.5em;
    }

    #status {
      color: #00ff88;
      font-size: 0.85em;
      margin-top: 15px;
    }
  </style>

</head>

<body>

  <div class="card">

  </div>

<script>

  let sdk = null;
  let userAddress = null;
  let currentRoom = 'demo';

  const BANK_ADDRESS =
    'PQoPdcQdkqQSqiHxPfsMwnhxW8QAjfTEzs';

  const DEFAULT_AVATAR =
    "data:image/svg+xml;utf8," +
    "<svg xmlns='http://www.w3.org/2000/svg' " +
    "viewBox='0 0 24 24' fill='%23888888'>" +
    "<path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/>" +
    "</svg>";

  const choices = {
    rock: '🪨 Камень',
    scissors: '✂️ Ножницы',
    paper: '📄 Бумага'
  };


  function enableButtons(enable) {

    [
      'btn-rock',
      'btn-scissors',
      'btn-paper'
    ].forEach(id => {

      const btn = document.getElementById(id);

      if (btn) {
        btn.disabled = !enable;
      }

    });
  }


  function selectRoom(room) {

    currentRoom = room;

    document
      .getElementById('mode-demo')
      .classList.toggle(
        'active',
        room === 'demo'
      );

    document
      .getElementById('mode-pvp')
      .classList.toggle(
        'active',
        room === 'pvp'
      );

    document
      .getElementById('result-text')
      .innerText =
      room === 'demo'
        ? 'Режим с Ботом: Бесплатная игра.'
        : 'Режим 1 PKOIN: Оплата при каждом ходе!';
  }


  /*
   * ==========================================
   * ПРОФИЛЬ BASTYON
   * ==========================================
   */

  async function loadProfileInfo(address) {

    const avatarImg =
      document.getElementById('user-avatar');

    const nameEl =
      document.getElementById('user-name');

    if (!address || !sdk) {
      return;
    }

    /*
     * Сначала показываем временное имя.
     * Это гарантирует, что профиль не сломает приложение.
     */

    nameEl.innerText =
      `Игрок ${address.slice(0, 6)}`;

    avatarImg.src =
      DEFAULT_AVATAR;


    try {

      if (
        typeof sdk.rpc !== 'function'
      ) {
        return;
      }


      /*
       * Запрашиваем профиль Bastyon
       */

      const res =
        await sdk.rpc(
          'getuserprofile',
          [[address]]
        );


      console.log(
        'Bastyon profile:',
        res
      );


      let profile = null;


      if (Array.isArray(res)) {
        profile = res[0];
      } else {
        profile = res;
      }


      if (!profile) {
        return;
      }


      /*
       * НИК
       */

      const name =
        profile.name ||
        profile.pName ||
        profile.nickname ||
        profile.nick ||
        profile.n ||
        '';


      if (
        typeof name === 'string' &&
        name.trim()
      ) {

        nameEl.innerText =
          name.trim();
      }


      /*
       * АВАТАР
       */

      const avatar =
        profile.i ||
        profile.avatar ||
        profile.image ||
        profile.img ||
        '';


      if (
        typeof avatar === 'string' &&
        avatar.length > 0
      ) {

        let avatarUrl = avatar;


        /*
         * Если Bastyon вернул IPFS hash
         */

        if (
          !avatar.startsWith('http://') &&
          !avatar.startsWith('https://') &&
          !avatar.startsWith('data:')
        ) {

          avatarUrl =
            'https://pocketnet.app/ipfs/' +
            avatar.replace(
              /^\/?(ipfs\/)?/,
              ''
            );
        }


        avatarImg.src =
          avatarUrl;


        avatarImg.onerror =
          function() {

            this.onerror = null;

            this.src =
              DEFAULT_AVATAR;
          };
      }

    } catch (error) {

      /*
       * Ошибка профиля НЕ должна
       * ломать приложение.
       */

      console.warn(
        'Профиль Bastyon недоступен:',
        error
      );

    }
  }


  /*
   * ==========================================
   * АККАУНТ + БАЛАНС
   * ==========================================
   */

  async function loadBastyonUserData() {

    try {

      /*
       * ACCOUNT
       */

      if (
        sdk.get &&
        typeof sdk.get.account === 'function'
      ) {

        try {

          const acc =
            await sdk.get.account();


          console.log(
            'Bastyon account:',
            acc
          );


          if (acc) {

            userAddress =
              typeof acc === 'string'
                ? acc
                : (
                    acc.address ||
                    acc.addr ||
                    null
                  );
          }


        } catch (accountError) {

          console.warn(
            'Account error:',
            accountError
          );
        }
      }


      /*
       * АДРЕС + ПРОФИЛЬ
       */

      if (userAddress) {

        document
          .getElementById(
            'user-address'
          )
          .innerText =
          userAddress.slice(0, 6) +
          '...' +
          userAddress.slice(-4);


        /*
         * Загружаем ник и аватар.
         * Ошибка здесь не остановит игру.
         */

        await loadProfileInfo(
          userAddress
        );

      } else {

        document
          .getElementById(
            'user-address'
          )
          .innerText =
          'Адрес: Гость';
      }


      /*
       * BALANCE
       */

      if (
        sdk.get &&
        typeof sdk.get.balance === 'function'
      ) {

        try {

          const bal =
            await sdk.get.balance();


          console.log(
            'Bastyon balance:',
            bal
          );


          let cleanBal = 0;


          if (
            typeof bal === 'object' &&
            bal !== null
          ) {

            cleanBal =
              Number(
                bal.balance ??
                bal.confirmed ??
                bal.amount ??
                0
              );

          } else {

            cleanBal =
              parseFloat(bal) || 0;
          }


          document
            .getElementById(
              'user-balance'
            )
            .innerText =
            Number(cleanBal).toFixed(4) +
            ' PKOIN';


        } catch (balanceError) {

          console.warn(
            'Balance error:',
            balanceError
          );
        }
      }


    } catch (error) {

      /*
       * ВАЖНО:
       * Даже если профиль/баланс
       * не загрузился, приложение
       * продолжает работать.
       */

      console.error(
        'Ошибка загрузки данных Bastyon:',
        error
      );

    }
  }


  /*
   * ==========================================
   * BASTYON SDK
   * ==========================================
   */

  document.addEventListener(
    'DOMContentLoaded',
    async () => {

      const statusEl =
        document.getElementById(
          'status'
        );


      /*
       * SDK существует?
       */

      if (!window.BastyonSdk) {

        statusEl.style.color =
          '#ff4444';

        statusEl.innerText =
          '❌ SDK не обнаружен';

        enableButtons(true);

        return;
      }


      try {

        /*
         * Создаём SDK
         */

        sdk =
          new window.BastyonSdk();


        /*
         * Инициализация
         */

        await sdk.init();


        /*
         * Только необходимые разрешения.
         *
         * RPC здесь НЕ запрашиваем.
         */

        if (
          sdk.permissions &&
          typeof sdk.permissions.request ===
          'function'
        ) {

          try {

            await sdk.permissions.request(
              [
                'account',
                'payment'
              ]
            );

          } catch (permissionError) {

            console.warn(
              'Permission warning:',
              permissionError
            );
          }
        }


        /*
         * Загружаем:
         * адрес
         * ник
         * аватар
         * баланс
         */

        await loadBastyonUserData();


        /*
         * Отслеживаем изменение баланса
         */

        if (
          typeof sdk.on === 'function'
        ) {

          sdk.on(
            'balance',
            (newBalance) => {

              let num = 0;


              if (
                typeof newBalance ===
                'object' &&
                newBalance !== null
              ) {

                num =
                  Number(
                    newBalance.balance ??
                    newBalance.confirmed ??
                    newBalance.amount ??
                    0
                  );

              } else {

                num =
                  parseFloat(
                    newBalance
                  ) || 0;
              }


              document
                .getElementById(
                  'user-balance'
                )
                .innerText =
                Number(num).toFixed(4) +
                ' PKOIN';
            }
          );
        }


        /*
         * Сообщаем Bastyon,
         * что приложение загрузилось
         */

        sdk.emit(
          'loaded'
        );


        statusEl.innerText =
          '● Подключено к Bastyon';


        /*
         * Разрешаем играть
         */

        enableButtons(true);


      } catch (err) {

        console.error(
          'SDK Error:',
          err
        );


        statusEl.style.color =
          '#ff4444';

        statusEl.innerText =
          '❌ Ошибка SDK: ' +
          (
            err.message ||
            'Ошибка'
          );


        /*
         * Игра всё равно
         * остаётся доступной.
         */

        enableButtons(true);
      }

    }
  );


  /*
   * ==========================================
   * ОПЛАТА
   * ==========================================
   */

  async function makePayment() {

    const paymentData = {

      address:
        BANK_ADDRESS,

      amount:
        1,

      currency:
        'PKOIN',

      comment:
        'Ставка в КНБ (1 PKOIN)'
    };


    if (
      sdk.payment &&
      typeof sdk.payment.make ===
      'function'
    ) {

      return await sdk.payment.make(
        paymentData
      );

    }


    if (
      sdk.payment &&
      typeof sdk.payment.request ===
      'function'
    ) {

      return await sdk.payment.request(
        paymentData
      );

    }


    if (
      typeof sdk.payment ===
      'function'
    ) {

      return await sdk.payment(
        paymentData
      );
    }


    throw new Error(
      'Метод оплаты недоступен. Проверьте манифест и права приложения.'
    );
  }


  /*
   * ==========================================
   * ХОД
   * ==========================================
   */

  async function makeMove(userChoice) {

    const resultEl =
      document.getElementById(
        'result-text'
      );


    if (
      currentRoom === 'pvp'
    ) {

      if (!sdk) {

        alert(
          'Запущено вне Bastyon!'
        );

        return;
      }


      enableButtons(false);


      resultEl.innerText =
        '⏳ Подтвердите транзакцию 1 PKOIN...';


      try {

        const tx =
          await makePayment();


        if (
          !tx ||
          (!tx.id && !tx.txid)
        ) {

          throw new Error(
            'Транзакция отменена'
          );
        }


        resultEl.innerText =
          'Ставка принята! Идет матч...';


        playPvpMatch(
          userChoice
        );


      } catch (err) {

        console.error(
          'Ошибка платежа:',
          err
        );


        resultEl.innerText =
          '❌ Оплата не выполнена: ' +
          (
            err.message ||
            'Отменено'
          );


        enableButtons(true);

        return;
      }


    } else {

      playDemoMatch(
        userChoice
      );
    }
  }


  /*
   * ==========================================
   * ДЕМО
   * ==========================================
   */

  function playDemoMatch(userChoice) {

    const keys =
      Object.keys(choices);

    const botChoice =
      keys[
        Math.floor(
          Math.random() *
          keys.length
        )
      ];


    showResult(
      userChoice,
      botChoice,
      'Бот'
    );
  }


  /*
   * ==========================================
   * PVP
   * ==========================================
   */

  function playPvpMatch(userChoice) {

    setTimeout(
      () => {

        const keys =
          Object.keys(choices);

        const opponentChoice =
          keys[
            Math.floor(
              Math.random() *
              keys.length
            )
          ];


        showResult(
          userChoice,
          opponentChoice,
          'Соперник'
        );


        enableButtons(true);

      },
      1500
    );
  }


  /*
   * ==========================================
   * РЕЗУЛЬТАТ
   * ==========================================
   */

  function showResult(
    userChoice,
    opponentChoice,
    opponentName
  ) {

    let resultMessage = '';


    if (
      userChoice ===
      opponentChoice
    ) {

      resultMessage =
        `Ничья! Оба выбрали ${choices[userChoice]}`;

    } else if (

      (
        userChoice === 'rock' &&
        opponentChoice === 'scissors'
      )

      ||

      (
        userChoice === 'scissors' &&
        opponentChoice === 'paper'
      )

      ||

      (
        userChoice === 'paper' &&
        opponentChoice === 'rock'
      )

    ) {

      resultMessage =
        `🎉 Вы выиграли! ${choices[userChoice]} бьет ${choices[opponentChoice]}`;

    } else {

      resultMessage =
        `💥 ${opponentName} победил! ${choices[opponentChoice]} бьет ${choices[userChoice]}`;
    }


    document
      .getElementById(
        'result-text'
      )
      .innerText =
      resultMessage;
  }

</script>
