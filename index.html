<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    КНБ — Камень Ножницы Бумага
  </title>

  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 18px 12px 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #303030 0%,
          #1b1b1b 34%,
          #111111 100%
        );

      color: #ffffff;

    }


    .card {

      width: 100%;

      max-width: 720px;

      margin: 0 auto;

      padding: 18px;

      background:
        rgba(
          38,
          38,
          38,
          0.96
        );

      border:
        1px solid #383838;

      border-radius:
        20px;

      box-shadow:
        0 14px 40px
        rgba(
          0,
          0,
          0,
          0.45
        );

    }


    /* HEADER */

    .app-header {

      margin-bottom: 16px;

      text-align: center;

    }


    h1 {

      margin: 0;

      font-size: 30px;

      line-height: 1.1;

    }


    .subtitle {

      margin-top: 7px;

      color: #9a9a9a;

      font-size: 13px;

    }


    /* PROFILE */

    .profile-card {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px;

      margin-bottom: 18px;

      background: #1d1d1d;

      border:
        1px solid #353535;

      border-radius:
        14px;

    }


    .profile-avatar {

      width: 56px;

      height: 56px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      background: #333;

      border:
        2px solid #00ff88;

      display: block;

    }


    .profile-info {

      min-width: 0;

      flex: 1;

    }


    .profile-name {

      font-size: 17px;

      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .profile-address {

      margin-top: 3px;

      color: #858585;

      font-family: monospace;

      font-size: 12px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .profile-balance {

      margin-top: 5px;

      color: #00ff88;

      font-size: 14px;

      font-weight: 800;

    }


    /* SCREENS */

    .screen {

      display: none;

    }


    .screen.active {

      display: block;

    }


    /* MAIN */

    .section-title {

      margin:
        4px 0 10px;

      font-size: 18px;

      font-weight: 800;

    }


    .section-description {

      margin:
        0 0 14px;

      color: #999;

      font-size: 13px;

      line-height: 1.4;

    }


    /* ROOMS */

    .rooms-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

    }


    .room-card {

      position: relative;

      width: 100%;

      min-height: 120px;

      padding: 14px;

      text-align: left;

      border:
        1px solid #424242;

      border-radius:
        14px;

      background:
        linear-gradient(
          180deg,
          #333333 0%,
          #292929 100%
        );

      color: #ffffff;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        border-color 0.2s ease,
        background 0.2s ease;

    }


    .room-card:hover {

      transform:
        translateY(-2px);

      border-color:
        #00ff88;

      background:
        linear-gradient(
          180deg,
          #383838 0%,
          #2d2d2d 100%
        );

    }


    .room-card:active {

      transform:
        scale(
          0.98
        );

    }


    .room-card.free {

      border-color:
        #00ff88;

    }


    .room-number {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      width: 27px;

      height: 27px;

      margin-right: 7px;

      border-radius: 8px;

      background:
        #1c1c1c;

      color:
        #cfcfcf;

      font-size: 11px;

      font-weight: 800;

      vertical-align:
        middle;

    }


    .room-name {

      font-size:
        15px;

      font-weight:
        800;

      vertical-align:
        middle;

    }


    .room-stake {

      margin-top:
        10px;

      color:
        #00ff88;

      font-size:
        14px;

      font-weight:
        800;

    }


    .room-mode {

      margin-top:
        4px;

      color:
        #999;

      font-size:
        11px;

    }


    .room-enter {

      margin-top:
        10px;

      color:
        #ffffff;

      font-size:
        11px;

      font-weight:
        700;

    }


    .room-badge {

      position:
        absolute;

      top:
        10px;

      right:
        10px;

      padding:
        4px 7px;

      border-radius:
        6px;

      background:
        #1d1d1d;

      color:
        #999;

      font-size:
        9px;

      font-weight:
        800;

      text-transform:
        uppercase;

    }


    .room-card.free .room-badge {

      color:
        #8affbf;

      background:
        #174b31;

    }


    /* ROOM SCREEN */

    .back-button {

      width: 100%;

      margin-bottom:
        12px;

      padding:
        11px;

      border:
        1px solid #444;

      border-radius:
        11px;

      background:
        #292929;

      color:
        #ffffff;

      cursor:
        pointer;

      font-size:
        13px;

      font-weight:
        700;

    }


    .back-button:hover {

      background:
        #333;

      border-color:
        #666;

    }


    .room-header {

        18px;

      text-align:
        center;

      background:
        #1e1e1e;

        1px solid #383838;

      border-radius:

    .room-header-number {

        11px;

      font-weight:
        800;

      text-transform:

      letter-spacing:

    .room-header-name {

        5px;

      font-size:
        25px;

      font-weight:
        900;

    }


    .room-header-stake {

        7px;

      color:
        #00ff88;

      font-size:
        18px;

      font-weight:
        900;

    }


    .room-header-mode {

      margin-top:
        5px;

      color:
        #999;

      font-size:
        12px;

    }


    /* GAME */

    .game-panel {

      padding:
        16px;

      background:
        #202020;

      border:
        1px solid #343434;

      border-radius:
        15px;

    }


    .game-title {

      text-align:
        center;

      font-size:
        16px;

      font-weight:
        800;

    }


    .game-subtitle {

      margin-top:
        5px;

      text-align:
        center;

      color:
        #8e8e8e;

      font-size:
        12px;

    }


    .buttons {

      display:
        flex;

      justify-content:
        center;

      gap:
        12px;

      margin:
        20px 0;

    }


    .game-btn {

      width:
        100px;

      height:
        100px;

      padding:
        10px;

      border:
        2px solid #444;

      border-radius:
        16px;

      background:
        #333;

      color:
        #fff;

      cursor:
        pointer;

      font-size:
        42px;

      transition:
        transform .15s,
        background .2s,
        border-color .2s;

    }


    .game-btn:hover:not(:disabled) {

      background:
        #444;

      border-color:
        #00ff88;

      transform:
        translateY(
          -3px
        );

    }


    .game-btn:active:not(:disabled) {

      transform:
        scale(
          .95
        );

    }


    .game-btn:disabled {

      opacity:
        .4;

      cursor:
        not-allowed;

    }


    /* RESULT */

    .result {

      min-height:
        72px;

      margin-top:
        12px;

      padding:
        14px;

      border-radius:
        12px;

      background:
        #171717;

      font-size:
        15px;

      font-weight:
        700;

      text-align:
        center;

      line-height:
        1.5;

    }


    /* PVP */

    .pvp-info {

      display:
        none;

      margin-top:
        12px;

      padding:
        12px;

      border-radius:
        10px;

      background:
        #202020;

      border:
        1px solid #333;

      color:
        #aaa;

      font-size:
        13px;

      line-height:
        1.5;

      text-align:
        center;

    .pvp-info.show {

    }


    .room-id {

      color:

    .action-button {

        12px;

        12px;

      border-radius:
        11px;

      background:
        #00ff88;

      color:

        pointer;

    .warning {

      color:

    }


    .success {

      }


      .game-btn {

        width:
          84px;

        height:
          84px;

        font-size:
          36px;

      }

    }

  </style>

</head>

    /* =====================================

       ===================================== */

    async function startPvpSearch() {

      const room =
        ROOMS[

      if (

        !room ||

        room.mode !==
          "pvp"

      ) {

        return;

      }


      stopPolling();


      currentChoice =

      enableButtons(
        false
      );


      const result =
        document.getElementById(
          "result-text"
        );


      const message =
        document.getElementById(
          "pvp-message"
        );


      const retry =
        document.getElementById(
          "pvp-retry"
        );


      result.innerText =
        "⏳ Ищем соперника...";


      message.innerText =
        "Подключение к " +
        room.name +
        "...";


      retry.style.display =
        "none";


      try {

        const response =
          await fetch(

            "/api/pvp/join",

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  action:
                    "join",

                  userId:
                    userAddress ||
                    "demo-user",

                  nickname:
                    document
                      .getElementById(
                        "user-name"
                      )
                      .innerText,

                  roomId:
                    currentRoom,

                  stake:
                    room.stake

                })

            }

          );


        const text =
          await response.text();


        let data =
          null;


        try {

          data =
            JSON.parse(
              text
            );

        }

        catch (
          error
        ) {

          console.warn(
            "PVP NON JSON:",
            text
          );

        }


        if (

          !response.ok ||

          !data

        ) {

          result.innerText =
            "❌ Ошибка PvP: " +
            response.status;


          message.innerText =
            data &&
            data.message

              ? data.message

              : "Не удалось войти в комнату.";


          retry.style.display =
            "block";


          return;

        }


        currentPvpRoom =
          data.room ||
          null;


        updatePvpState(
          data.room
        );


        if (

          currentPvpRoom &&

          currentPvpRoom.status ===
            "waiting"

        ) {

          pollTimer =
            setInterval(

              pollPvpStatus,

              2000

            );

        }

        else if (

          currentPvpRoom &&

          currentPvpRoom.status ===
            "matched"

        ) {

          enableButtons(
            true
          );

        }

      }


      catch (
        error
      ) {

        console.error(
          "PVP SEARCH ERROR:",
          error
        );


        result.innerText =
          "❌ Ошибка соединения с PvP.";


        message.innerText =
          "Сервер комнаты недоступен.";


        retry.style.display =
          "block";

      }

    }

        );

        result.innerText =
          "Ставка: " +

            currentRoom

        return;

      }


      if (

      ) {

          currentChoice

        );

      if (

        "finished"
      ) {

        enableButtons(
          false
        );


        renderFinished(

        );

    /* =====================================
       BALANCE
       ===================================== */

    function findBalance(
      balanceData
    ) {

      if (
        typeof balanceData ===
        "number"
      ) {

        return balanceData;

      }


      if (

        !balanceData ||

        typeof balanceData !==
          "object"

      ) {

        return null;

      }


      const priority = [

        balanceData.actual,

        balanceData.total,

        balanceData.balance,

        balanceData.confirmed,

        balanceData.available,

        balanceData.amount

      ];


      for (
        const value of priority
      ) {

        if (

          typeof value ===
            "number"

          &&

          Number.isFinite(
            value
          )

        ) {

          return value;

        }

      }


      return null;

    }

      balanceData
    ) {

      const element =
        document

          );


      if (!element) {

      console.log(
        "BASTYON BALANCE DATA:",
        balanceData

      const balance =
        findBalance(
          balanceData
        );


      if (
        balance ===
        null
      ) {

        element.innerText =
          "Баланс недоступен";


        element.classList.add(
          "warning"
        );

      element.innerText =

        ) +
        " PKOIN";


      element.classList.remove(
        "warning"
      );

    }


    /* =====================================
       PROFILE
       ===================================== */

    function normalizeProfile(
      payload
    ) {

      if (

        !payload ||

        typeof payload !==
          "object"

      ) {

        return {};

      }


      let profile =

        payload.profile ||

        payload.result ||

        payload.data ||

        payload;


      if (

        profile &&

        typeof profile ===
          "object" &&

        profile.profile

      ) {

        profile =
          profile.profile;

      }


      if (
        Array.isArray(
          profile
        )
      ) {

        profile =
          profile[0] ||
          {};

      }


      if (

        !profile ||

        typeof profile !==
          "object"

      ) {

        return {};

      }


      const name =

        profile.name ||

        profile.pName ||

        profile.nickname ||

        profile.username ||

        profile.displayName ||

        "";


      const avatar =

        profile.avatarUrl ||

        profile.avatar ||

        profile.image ||

        profile.imageUrl ||

        profile.i ||

        "";


      return {

        name:

          typeof name ===
          "string"

            ? name.trim()

            : "",


        avatar:

          typeof avatar ===
          "string"

            ? avatar.trim()

            : ""

      };

    }


    /* =====================================
       AVATAR
       ===================================== */

    function normalizeAvatarUrl(
      avatar
    ) {

      if (!avatar) {

        return "";

      }


      let url =
        String(
          avatar
        ).trim();


      if (!url) {

        return "";

      }


      if (
        url.startsWith(
          "//"
        )
      ) {

        return (
          "https:" +
          url
        );

      }


      if (
        /^https?:\/\//i.test(
          url
        )
      ) {

        return url;

      }


      if (
        url.startsWith(
          "data:"
        )
      ) {

        return url;

      }


      url =
        url.replace(
          /^\/+/,
          ""
        );


      if (
        url.startsWith(
          "ipfs/"
        )
      ) {

        return (
          "https://pocketnet.app/" +
          url
        );

      }


      return (
        "https://pocketnet.app/ipfs/" +
        url
      );

    }


    /* =====================================
       LOAD PROFILE
       ===================================== */

    async function loadProfileInfo(
      address
    ) {

      const avatarImg =
        document
          .getElementById(
            "user-avatar"
          );


      const nameEl =
        document
          .getElementById(
            "user-name"
          );


      if (!address) {

        nameEl.innerText =
          "Гость";


        avatarImg.src =
          DEFAULT_AVATAR;


        return;

      }


      avatarImg.src =
        DEFAULT_AVATAR;


      try {

        const response =
          await fetch(

            "/api/profile?address=" +

            encodeURIComponent(
              address
            ),

            {

              method:
                "GET",

              cache:
                "no-store"

            }

          );


        console.log(
          "PROFILE HTTP STATUS:",
          response.status
        );


        const text =
          await response.text();


        let payload =
          {};


        try {

          payload =
            JSON.parse(
              text
            );

        }

        catch (
          parseError
        ) {

          console.warn(
            "PROFILE NON JSON:",
            text
          );


          throw new Error(
            "Профиль вернул не JSON"
          );

        }


        console.log(
          "BASTYON PROFILE RAW:",
          payload
        );


        if (
          !response.ok
        ) {

          throw new Error(

            payload.error ||

            payload.message ||

            "Profile HTTP " +

            response.status

          );

        }


        const profile =
          normalizeProfile(
            payload
          );


        console.log(
          "BASTYON PROFILE NORMALIZED:",
          profile
        );


        if (
          profile.name
        ) {

          nameEl.innerText =
            profile.name;

        }

        else {

          nameEl.innerText =
            "Игрок " +
            String(
              address
            ).slice(
              0,
              6
            );

        }


        const avatarUrl =
          normalizeAvatarUrl(
            profile.avatar
          );


        if (avatarUrl) {

          avatarImg.onerror =
            function() {

              console.warn(
                "AVATAR LOAD ERROR:",
                avatarUrl
              );


              avatarImg.onerror =
                null;


              avatarImg.src =
                DEFAULT_AVATAR;

            };


          avatarImg.src =
            avatarUrl;

        }

      }


      catch (
        error
      ) {

        console.error(
          "PROFILE ERROR:",
          error
        );


        nameEl.innerText =
          "Игрок " +

          String(
            address
          ).slice(
            0,
            6
          );


        avatarImg.src =
          DEFAULT_AVATAR;

      }

    }

            DEFAULT_AVATAR;

      }


      const balanceData =
        await getBalance();


      if (
        balanceData !==
        null
      ) {

        showBalance(
          balanceData
        );

      }


      else {

        const balanceElement =
          document.getElementById(
            "user-balance"
          );


        balanceElement.innerText =
          "Баланс недоступен";


        balanceElement.classList.add(
          "warning"
        );

      }

    }


    /* =====================================
       DEFAULT AVATAR
       ===================================== */

    const DEFAULT_AVATAR =

      "data:image/svg+xml;utf8," +

      "<svg xmlns='http://www.w3.org/2000/svg' " +

      "viewBox='0 0 100 100'>" +

      "<circle cx='50' cy='50' r='50' " +

      "fill='%23333333'/>" +

      "<circle cx='50' cy='38' r='18' " +

      "fill='%23888888'/>" +

      "<path d='M20 90c4-22 18-32 30-32s26 10 30 32' " +

      "fill='%23888888'/>" +

      "</svg>";


    /* =====================================
       INIT
       ===================================== */

    document.addEventListener(

      "DOMContentLoaded",

      async function() {

        const status =
          document
            .getElementById(
              "status"
            );


        /*
         * КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ:
         * enableButtons теперь существует
         * до первого вызова.
         */

        enableButtons(
          false
        );


        if (
          !window.BastyonSdk
        ) {

          status.classList.add(
            "error"
          );


          status.innerText =
            "❌ SDK Bastyon не обнаружен";


          return;

        }


        try {

          sdk =
            new window.BastyonSdk();


          if (
            typeof sdk.init ===
            "function"
          ) {

            await sdk.init();

          }


          if (

            sdk.permissions &&

            typeof
              sdk.permissions.request ===
              "function"

          ) {

            try {

              await sdk.permissions.request([

                "account",

                "payment",

                "rpc"

              ]);

            }


            catch (
              error
            ) {

              console.warn(
                "PERMISSIONS ERROR:",
                error
              );

            }

          }


          await loadBastyonUserData();


          if (
            typeof sdk.on ===
            "function"
          ) {

            sdk.on(

              "balance",

              function(
                newBalance
              ) {

                console.log(
                  "BASTYON BALANCE EVENT:",
                  newBalance
                );


                showBalance(
                  newBalance
                );

              }

            );

          }


          if (
            typeof sdk.emit ===
            "function"
          ) {

            sdk.emit(
              "loaded"
            );

          }


          status.classList.remove(
            "error"
          );


          status.classList.add(
            "success"
          );


          status.innerText =
            "● Bastyon подключён";


        }


        catch (
          error
        ) {

          console.error(
            "SDK ERROR:",
            error
          );


          status.classList.add(
            "error"
          );


          status.innerText =

            "❌ Ошибка SDK: " +

            (

              error.message ||

              "Ошибка"

            );

        }

      }

    );

  </script>


</body>

</html>
