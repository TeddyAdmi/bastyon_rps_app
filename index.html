    КНБ — Камень Ножницы Бумага

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 18px 12px 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #303030 0%,
          #1b1b1b 34%,
          #111 100%
        );

      color: #fff;

    }


    .card {

      width: 100%;

      max-width: 720px;

      margin: 0 auto;

      padding: 18px;

      background:
        rgba(
          38,
          38,
          38,
          .96
        );

      border:
        1px solid #383838;

      border-radius:
        20px;

      box-shadow:
        0 14px 40px
        rgba(
          0,
          0,
          0,
          .45
        );

    }


    .app-header {

      text-align: center;

      margin-bottom: 16px;

    }


    h1 {

      margin: 0;

      font-size: 30px;

      line-height: 1.1;

    }


    .subtitle {

      margin-top: 7px;

      color: #9a9a9a;

      font-size: 13px;

    }


    .profile-card {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px;

      margin-bottom: 18px;

      background:
        #1d1d1d;

      border:
        1px solid #353535;

      border-radius:
        14px;

    }


    .profile-avatar {

      width: 56px;

      height: 56px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      background: #333;

      border:
        2px solid #00ff88;

    }


    .profile-info {

      min-width: 0;

      flex: 1;

    }


    .profile-name {

      font-size: 17px;

      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .profile-address {

      margin-top: 3px;

      color: #858585;

      font-family: monospace;

      font-size: 12px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .profile-balance {

      margin-top: 5px;

      color: #00ff88;

      font-size: 14px;

      font-weight: 800;

    }


    .screen {

      display: none;

    }


    .screen.active {

      display: block;

    }


    .section-title {

      margin:
        4px 0 10px;

      font-size: 18px;

      font-weight: 800;

    }


    .section-description {

      margin:
        0 0 14px;

      color: #999;

      font-size: 13px;

    }


    .rooms-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

    }


    .room-card {

      position: relative;

      width: 100%;

      min-height: 122px;

      padding: 14px;

      text-align: left;

      border:
        1px solid #424242;

      border-radius:
        14px;

      background:
        linear-gradient(
          180deg,
          #333 0%,
          #292929 100%
        );

      color: #fff;

      cursor: pointer;

      transition:
        transform .15s,
        border-color .2s,
        background .2s;

    }


    .room-card:hover {

      transform:
        translateY(-2px);

      border-color:
        #00ff88;

      background:
        linear-gradient(
          180deg,
          #383838 0%,
          #2d2d2d 100%
        );

    }


    .room-card.free {

      border-color:
        #00ff88;

    }


    .room-number {

      justify-content: center;

      width: 27px;

      height: 27px;

      margin-right: 7px;

      border-radius: 8px;

      background: #1c1c1c;

      color: #cfcfcf;

      font-size: 11px;

      font-weight: 800;

      vertical-align: middle;

    }


    .room-name {

      font-size: 15px;

      font-weight: 800;

    }


    .room-stake {

      margin-top: 10px;

      color: #00ff88;

      font-size: 14px;

      font-weight: 800;

    }


    .room-mode {

      margin-top: 4px;

      color: #999;

      font-size: 11px;

    }


    .room-enter {

      margin-top: 10px;

      font-size: 11px;

      font-weight: 700;

    }


    .room-badge {

      top: 10px;

      right: 10px;

      padding: 4px 7px;

      border-radius: 6px;

      background: #1d1d1d;

      color: #999;

      border-radius:
        11px;

      background: #292929;

      color: #fff;

      font-weight: 700;

    .room-header {

      border:

    }


    .room-header-number {

      font-size: 11px;

      font-weight: 800;

    }


    .room-header-name {

    .room-header-stake {

    .room-header-mode {

    .game-panel {

    .game-title {

    .game-subtitle {

    .buttons {

    .game-btn {

      color: #fff;

    .game-btn:hover:not(:disabled) {

    .room-id {

          1fr;

      }


      .game-btn {

        width: 84px;

        height: 84px;

        font-size: 36px;

      }

    }

  </style>

</head>

    const DEFAULT_AVATAR =

      "data:image/svg+xml;utf8," +

      "<svg xmlns='http://www.w3.org/2000/svg' " +

      "viewBox='0 0 100 100'>" +

      "<circle cx='50' cy='50' r='50' " +

      "fill='%23333333'/>" +

      "<circle cx='50' cy='38' r='18' " +

      "fill='%23888888'/>" +

      "<path d='M20 90c4-22 18-32 30-32s26 10 30 32' " +

      "fill='%23888888'/>" +

      "</svg>";


    function showScreen(
      id
    ) {

      document
        .querySelectorAll(
          ".screen"
        )
        .forEach(
          function(el) {

            el.classList.remove(
              "active"
            );

          }
        );


      document
        .getElementById(
          id
        )
        .classList.add(
          "active"
        );

    }


    function stopPolling() {

      if (pollTimer) {

        clearInterval(
          pollTimer
        );

        pollTimer =
          null;

      }

    }


    async function leaveRoom() {

      stopPolling();


      if (

        currentPvpRoom &&

        currentRoom !==
          "room-1"

      ) {

        try {

          await fetch(

            "/api/pvp/join",

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  action:
                    "leave",

                  userId:
                    userAddress ||
                    "demo-user",

                  gameRoomId:
                    currentPvpRoom.id

                })

            }

          );

        }

        catch (
          error
        ) {

          console.warn(
            "PVP LEAVE ERROR:",
            error
          );

        }

      }


      currentPvpRoom =
        null;


      currentChoice =
        null;


      enableButtons(
        false
      );


      showScreen(
        "main-screen"
      );

    }


    function enterRoom(
      roomId
    ) {

      const room =
        ROOMS[
          roomId
        ];


      if (!room) {

        return;

      }


      stopPolling();


      currentRoom =
        roomId;


      currentPvpRoom =
        null;


      currentChoice =
        null;


      enableButtons(
        false
      );


      document
        .getElementById(
          "room-header-number"
        )
        .innerText =
          "Комната " +
          room.number;


      document
        .getElementById(
          "room-header-name"
        )
        .innerText =
          room.name;


      document
        .getElementById(
          "room-header-stake"
        )
        .innerText =
          room.stakeText;


      document
        .getElementById(
          "room-header-mode"
        )
        .innerText =
          room.modeText;


      document
        .getElementById(
          "pvp-room"
        )
        .innerText =
          "";


      if (
        room.mode ===
        "demo"
      ) {

        document
          .getElementById(
            "game-subtitle"
          )
          .innerText =
            "🤖 Бесплатная игра с компьютером";


        document
          .getElementById(
            "result-text"
          )
          .innerText =
            "Сделайте свой ход.";


        document
          .getElementById(
            "pvp-info"
          )
          .classList.remove(
            "show"
          );


        enableButtons(
          true
        );

      }

      else {

        document
          .getElementById(
            "game-subtitle"
          )
          .innerText =
            "⚔️ Поиск соперника • " +
            room.stakeText;


        document
          .getElementById(
            "pvp-info"
          )
          .classList.add(
            "show"
          );


        document
          .getElementById(
            "pvp-retry"
          )
          .style.display =
            "none";


        showScreen(
          "room-screen"
        );


        startPvpSearch();


        return;

      }


      showScreen(
        "room-screen"
      );

    }


    async function startPvpSearch() {

      const room =
        ROOMS[
          currentRoom
        ];


      if (

        !room ||

        room.mode !==
          "pvp"

      ) {

        return;

      }


      stopPolling();


      currentChoice =
        null;


      enableButtons(
        false
      );


      const result =
        document
          .getElementById(
            "result-text"
          );


      const message =
        document
          .getElementById(
            "pvp-message"
          );


      const retry =
        document
          .getElementById(
            "pvp-retry"
          );


      result.innerText =
        "⏳ Ищем соперника...";


      message.innerText =
        "Подключение к комнате " +
        room.name +
        "...";


      retry.style.display =
        "none";


      try {

        const response =
          await fetch(

            "/api/pvp/join",

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  action:
                    "join",

                  userId:
                    userAddress ||
                    "demo-user",

                  nickname:
                    document
                      .getElementById(
                        "user-name"
                      )
                      .innerText,

                  roomId:
                    currentRoom,

                  stake:
                    room.stake

                })

            }

          );


        const text =
          await response.text();


        let data =
          null;


        try {

          data =
            JSON.parse(
              text
            );

        }

        catch (
          error
        ) {

          console.warn(
            "PVP NON JSON:",
            text
          );

        }


        if (
          !response.ok ||
          !data
        ) {

          result.innerText =
            "❌ Ошибка PvP: " +
            response.status;


          message.innerText =
            "Не удалось войти в комнату.";


          retry.style.display =
            "block";


          return;

        }


        currentPvpRoom =
          data.room ||
          null;


        updatePvpState(
          data.room
        );


        if (

          currentPvpRoom &&

          currentPvpRoom.status ===
            "waiting"

        ) {

          pollTimer =
            setInterval(

              pollPvpStatus,

              2000

            );

        }

        else if (

          currentPvpRoom &&

          currentPvpRoom.status ===
            "matched"

        ) {

          enableButtons(
            true
          );

        }

      }


      catch (
        error
      ) {

        console.error(
          "PVP SEARCH ERROR:",
          error
        );


        result.innerText =
          "❌ PvP сервер недоступен.";


        message.innerText =
          "Проверь соединение и попробуй ещё раз.";


        retry.style.display =
          "block";

      }

    }


    function updatePvpState(
      room
    ) {

      if (!room) {

        return;

      }


      currentPvpRoom =
        room;


      document
        .getElementById(
          "pvp-room"
        )
        .innerText =
          "Комната игры: " +
          room.id;


      const message =
        document
          .getElementById(
            "pvp-message"
          );


      const result =
        document
          .getElementById(
            "result-text"
          );


      if (
        room.status ===
        "waiting"
      ) {

        enableButtons(
          false
        );


        message.innerText =
          "⏳ Ожидаем второго игрока...";


        result.innerText =
          "Ставка: " +
          ROOMS[
            currentRoom
          ].stakeText +
          " • поиск соперника";


        return;

      }


      if (
        room.status ===
        "matched"
      ) {

        message.innerText =
          "✅ Соперник найден. Сделайте ход.";


        if (
          currentChoice
        ) {

          result.innerText =
            "✅ Ваш ход принят. Ожидаем соперника.";

        }

        else {

          result.innerText =
            "🎮 Игра началась!";

        }


        enableButtons(
          !currentChoice
        );


        return;

      }


      if (
        room.status ===
        "finished"
      ) {

        stopPolling();


        enableButtons(
          false
        );


        renderFinished(
          room
        );

      }

    }


    async function pollPvpStatus() {

      if (!currentPvpRoom) {

        return;

      }


      try {

        const response =
          await fetch(

            "/api/pvp/join",

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  action:
                    "status",

                  userId:
                    userAddress ||
                    "demo-user",

                  gameRoomId:
                    currentPvpRoom.id

                })

            }

          );


        const data =
          await response.json();


        if (

          response.ok &&

          data.room

        ) {

          updatePvpState(
            data.room
          );

        }

      }


      catch (
        error
      ) {

        console.warn(
          "PVP STATUS ERROR:",
          error
        );

      }

    }


    function playDemoMatch(
      userChoice
    ) {

      const keys =
        Object.keys(
          choices
        );


      const botChoice =
        keys[
          Math.floor(
            Math.random() *
            keys.length
          )
        ];


      showResult(

        userChoice,

        botChoice,

        "Бот"

      );

    }


    async function playPvpMove(
      userChoice
    ) {

      if (!currentPvpRoom) {

        return;

      }


      currentChoice =
        userChoice;


      enableButtons(
        false
      );


      document
        .getElementById(
          "result-text"
        )
        .innerText =
          "⏳ Отправляем ваш ход...";


      try {

        const response =
          await fetch(

            "/api/pvp/join",

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  action:
                    "move",

                  userId:
                    userAddress ||
                    "demo-user",

                  gameRoomId:
                    currentPvpRoom.id,

                  choice:
                    userChoice

                })

            }

          );


        const data =
          await response.json();


        if (!response.ok) {

          currentChoice =
            null;


          enableButtons(
            true
          );


          document
            .getElementById(
              "result-text"
            )
            .innerText =
              "❌ " +
              (
                data.message ||
                "Не удалось отправить ход"
              );


          return;

        }


        updatePvpState(
          data.room
        );

      }


      catch (
        error
      ) {

        console.error(
          "PVP MOVE ERROR:",
          error
        );


        currentChoice =
          null;


        enableButtons(
          true
        );


        document
          .getElementById(
            "result-text"
          )
          .innerText =
            "❌ Ошибка отправки хода.";

      }

    }


    async function makeMove(
      userChoice
    ) {

      const room =
        ROOMS[
          currentRoom
        ];


      if (!room) {

        return;

      }


      if (
        room.mode ===
        "demo"
      ) {

        playDemoMatch(
          userChoice
        );


        return;

      }


      await playPvpMove(
        userChoice
      );

    }


    function renderFinished(
      room
    ) {

      const me =
        userAddress ||
        "demo-user";


      if (
        room.result ===
        "draw"
      ) {

        document
          .getElementById(
            "result-text"
          )
          .innerText =
            "🤝 Ничья!";

      }

      else if (
        room.winnerUserId ===
        me
      ) {

        document
          .getElementById(
            "result-text"
          )
          .innerText =
            "🎉 Вы выиграли!";

      }

      else {

        document
          .getElementById(
            "result-text"
          )
          .innerText =
            "💥 Победитель: " +
            (
              room.winnerNickname ||
              "соперник"
            );

      }


      document
        .getElementById(
          "pvp-message"
        )
        .innerText =
          "Игра завершена.";

    }


    function showResult(

      userChoice,

      opponentChoice,

      opponentName

    ) {

      let text =
        "";


      if (
        userChoice ===
        opponentChoice
      ) {

        text =
          "Ничья! Оба выбрали " +
          choices[
            userChoice
          ];

      }

      else if (

        (

          userChoice ===
            "rock" &&

          opponentChoice ===
            "scissors"

        )

        ||

        (

          userChoice ===
            "scissors" &&

          opponentChoice ===
            "paper"

        )

        ||

        (

          userChoice ===
            "paper" &&

          opponentChoice ===
            "rock"

        )

      ) {

        text =
          "🎉 Вы выиграли! " +
          choices[
            userChoice
          ] +
          " бьет " +
          choices[
            opponentChoice
          ];

      }

      else {

        text =
          "💥 " +
          opponentName +
          " победил! " +
          choices[
            opponentChoice
          ] +
          " бьет " +
          choices[
            userChoice
          ];

      }


      document
        .getElementById(
          "result-text"
        )
        .innerText =
          text;

    }


    function shortAddress(
      address
    ) {

      if (!address) {

        return "Адрес: --";

      }


      const text =
        String(
          address
        );


      if (
        text.length <=
        12
      ) {

        return text;

      }


      return (

        text.slice(
          0,
          6
        ) +

        "..." +

        text.slice(
          -4
        )

      );

    }


    function showAddress(
      address
    ) {

      const element =
        document
          .getElementById(
            "user-address"
          );


      if (element) {

        element.innerText =
          address

            ? shortAddress(
                address
              )

            : "Адрес: не определён";

      }

    }


    function findBalance(
      data
    ) {

      if (
        typeof data ===
        "number"
      ) {

        return data;

      }


      if (
        !data ||
        typeof data !==
          "object"
      ) {

        return null;

      }


      for (

        const value of [

          data.actual,

          data.total,

          data.balance,

          data.confirmed,

          data.available,

          data.amount

        ]

      ) {

        if (

          typeof value ===
            "number"

          &&

          Number.isFinite(
            value
          )

        ) {

          return value;

        }

      }


      return null;

    }


    function showBalance(
      data
    ) {

      const element =
        document
          .getElementById(
            "user-balance"
          );


      if (!element) {

        return;

      }


      const balance =
        findBalance(
          data
        );


      if (
        balance ===
        null
      ) {

        element.innerText =
          "Баланс недоступен";


        element.classList.add(
          "warning"
        );


        return;

      }


      element.innerText =
        Number(
          balance
        ).toFixed(
          4
        ) +
        " PKOIN";


      element.classList.remove(
        "warning"
      );

    }


    function normalizeProfile(
      payload
    ) {

      if (

        !payload ||

        typeof payload !==
          "object"

      ) {

        return {};

      }


      let profile =

        payload.profile ||

        payload.result ||

        payload.data ||

        payload;


      if (

        profile &&

        typeof profile ===
          "object" &&

        profile.profile

      ) {

        profile =
          profile.profile;

      }


      if (
        Array.isArray(
          profile
        )
      ) {

        profile =
          profile[0] ||
          {};

      }


      if (

        !profile ||

        typeof profile !==
          "object"

      ) {

        return {};

      }


      const name =

        profile.name ||

        profile.pName ||

        profile.nickname ||

        profile.username ||

        profile.displayName ||

        "";


      const avatar =

        profile.avatarUrl ||

        profile.avatar ||

        profile.image ||

        profile.imageUrl ||

        profile.i ||

        "";


      return {

        name:

          typeof name ===
          "string"

            ? name.trim()

            : "",


        avatar:

          typeof avatar ===
          "string"

            ? avatar.trim()

            : ""

      };

    }


    function normalizeAvatarUrl(
      avatar
    ) {

      if (!avatar) {

        return "";

      }


      let url =
        String(
          avatar
        ).trim();


      if (!url) {

        return "";

      }


      if (
        url.startsWith(
          "//"
        )
      ) {

        return (
          "https:" +
          url
        );

      }


      if (
        /^https?:\/\//i.test(
          url
        )
      ) {

        return url;

      }


      if (
        url.startsWith(
          "data:"
        )
      ) {

        return url;

      }


      url =
        url.replace(
          /^\/+/,
          ""
        );


      if (
        url.startsWith(
          "ipfs/"
        )
      ) {

        return (
          "https://pocketnet.app/" +
          url
        );

      }


      return (
        "https://pocketnet.app/ipfs/" +
        url
      );

    }


    async function loadProfileInfo(
      address
    ) {

      const avatarImg =
        document
          .getElementById(
            "user-avatar"
          );


      const nameEl =
        document
          .getElementById(
            "user-name"
          );


      if (!address) {

        nameEl.innerText =
          "Гость";


        avatarImg.src =
          DEFAULT_AVATAR;


        return;

      }


      avatarImg.src =
        DEFAULT_AVATAR;


      try {

        const response =
          await fetch(

            "/api/profile?address=" +

            encodeURIComponent(
              address
            ),

            {

              method:
                "GET",

              cache:
                "no-store"

            }

          );


        const payload =
          await response.json();


        if (
          !response.ok
        ) {

          throw new Error(
            payload.error ||
            payload.message ||
            "Profile error"
          );

        }


        const profile =
          normalizeProfile(
            payload
          );


        nameEl.innerText =

          profile.name ||

          (
            "Игрок " +
            String(
              address
            ).slice(
              0,
              6
            )
          );


        const avatarUrl =
          normalizeAvatarUrl(
            profile.avatar
          );


        if (avatarUrl) {

          avatarImg.onerror =
            function() {

              avatarImg.onerror =
                null;

              avatarImg.src =
                DEFAULT_AVATAR;

            };


          avatarImg.src =
            avatarUrl;

        }

      }

      catch (
        error
      ) {

        console.error(
          "PROFILE ERROR:",
          error
        );


        nameEl.innerText =

          "Игрок " +

          String(
            address
          ).slice(
            0,
            6
          );


        avatarImg.src =
          DEFAULT_AVATAR;

      }

    }


    async function getAccount() {

      if (

        !sdk ||

        !sdk.get ||

        typeof sdk.get.account !==
          "function"

      ) {

        return null;

      }


      try {

        const account =
          await sdk.get.account();


        console.log(
          "BASTYON ACCOUNT RAW:",
          account
        );


        if (

          typeof account ===
          "string"

        ) {

          return account;

        }


        if (

          account &&

          typeof account ===
            "object"

        ) {

          return (

            account.address ||

            account.addr ||

            account.id ||

            account.userId ||

            null

          );

        }

      }


      catch (
        error
      ) {

        console.error(
          "ACCOUNT ERROR:",
          error
        );

      }


      return null;

    }


    async function getBalance() {

      if (

        !sdk ||

        !sdk.get ||

        typeof sdk.get.balance !==
          "function"

      ) {

        return null;

      }


      try {

        const balance =
          await sdk.get.balance();


        console.log(
          "BASTYON BALANCE RAW:",
          balance
        );


        return balance;

      }


      catch (
        error
      ) {

        console.error(
          "BALANCE ERROR:",
          error
        );


        return null;

      }

    }


    async function loadBastyonUserData() {

      userAddress =
        await getAccount();


      showAddress(
        userAddress
      );


      if (
        userAddress
      ) {

        await loadProfileInfo(
          userAddress
        );

      }

      else {

        document
          .getElementById(
            "user-name"
          )
          .innerText =
            "Гость";


        document
          .getElementById(
            "user-avatar"
          )
          .src =
            DEFAULT_AVATAR;

      }


      const balanceData =
        await getBalance();


      if (
        balanceData !==
        null
      ) {

        showBalance(
          balanceData
        );

      }

      else {

        const el =
          document
            .getElementById(
              "user-balance"
            );


        el.innerText =
          "Баланс недоступен";


        el.classList.add(
          "warning"
        );

      }

    }


    document.addEventListener(

      "DOMContentLoaded",

      async function() {

        const status =
          document
            .getElementById(
              "status"
            );


        enableButtons(
          false
        );


        if (
          !window.BastyonSdk
        ) {

          status.classList.add(
            "error"
          );


          status.innerText =
            "❌ SDK Bastyon не обнаружен";


          return;

        }


        try {

          sdk =
            new window.BastyonSdk();


          if (
            typeof sdk.init ===
            "function"
          ) {

            await sdk.init();

          }


          if (

            sdk.permissions &&

            typeof
              sdk.permissions.request ===
              "function"

          ) {

            try {

              await sdk.permissions.request([

                "account",

                "payment",

                "rpc"

              ]);

            }

            catch (
              error
            ) {

              console.warn(
                "PERMISSIONS ERROR:",
                error
              );

            }

          }


          await loadBastyonUserData();


          if (
            typeof sdk.on ===
            "function"
          ) {

            sdk.on(

              "balance",

              function(
                newBalance
              ) {

                showBalance(
                  newBalance
                );

              }

            );

          }


          if (
            typeof sdk.emit ===
            "function"
          ) {

            sdk.emit(
              "loaded"
            );

          }


          status.classList.add(
            "success"
          );


          status.innerText =
            "● Bastyon подключён";

        }


        catch (
          error
        ) {

          console.error(
            "SDK ERROR:",
            error
          );


          status.classList.add(
            "error"
          );


          status.innerText =
            "❌ Ошибка SDK: " +
            (
              error.message ||
              "Ошибка"
            );

        }

      }

    );

  </script>
