<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра КНБ</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    /* Профиль пользователя */
    .profile-card {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      gap: 12px;
      text-align: left;
    }
    .profile-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #333;
      border: 2px solid #00ff88;
    }
    .profile-info {
      flex: 1;
      overflow: hidden;
    }
    .profile-name {
      font-weight: bold;
      font-size: 1.05em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-address {
      font-size: 0.75em;
      color: #888;
      font-family: monospace;
      margin-top: 2px;
    }
    .profile-balance {
      font-size: 0.9em;
      font-weight: 600;
      color: #00ff88;
      margin-top: 4px;
    }

    .rooms { display: flex; gap: 10px; margin-bottom: 20px; }
    .room-btn {
      flex: 1; padding: 10px; border: 2px solid #444; border-radius: 8px;
      background: #333; color: white; cursor: pointer; font-weight: bold;
    }
    .room-btn.active { border-color: #00ff88; background: #1e3a29; }

    .buttons { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
    .game-btn {
      font-size: 2em; padding: 10px 15px; border: none; border-radius: 8px;
      background: #333; cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    .game-btn:hover { background: #444; transform: scale(1.05); }
    .game-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result { font-size: 1.1em; font-weight: bold; margin-top: 15px; min-height: 1.5em; }
    #status { color: #00ff88; font-size: 0.85em; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🪨 ✂️ 📄 Игра КНБ</h1>
    
    <!-- Карточка профиля Bastyon -->
    <div class="profile-card">
      <img id="user-avatar" class="profile-avatar" src="https://bastyon.com/images/user.png" alt="Avatar" />
      <div class="profile-info">
        <div id="user-name" class="profile-name">Загрузка...</div>
        <div id="user-address" class="profile-address">Адрес: --</div>
        <div id="user-balance" class="profile-balance">0.0000 PKOIN</div>
      </div>
    </div>

    <!-- Режимы -->
    <div class="rooms">
      <button class="room-btn active" id="mode-demo" onclick="selectRoom('demo')">🤖 Демо (0 PKOIN)</button>
      <button class="room-btn" id="mode-pvp" onclick="selectRoom('pvp')">⚔️ Игроки (1 PKOIN)</button>
    </div>

    <!-- Кнопки хода -->
    <div class="buttons">
      <button class="game-btn" onclick="makeMove('rock')" id="btn-rock" disabled>🪨</button>
      <button class="game-btn" onclick="makeMove('scissors')" id="btn-scissors" disabled>✂️</button>
      <button class="game-btn" onclick="makeMove('paper')" id="btn-paper" disabled>📄</button>
    </div>

    <div class="result" id="result-text">Выберите режим и сделайте ваш ход!</div>
    <p id="status">Запуск Bastyon SDK...</p>
  </div>

  <script>
    let sdk = null;
let userAddress = null;
let currentRoom = 'demo';
const BANK_ADDRESS = 'ВАШ_АДРЕС_КОШЕЛЬКА_ИЗ_BASTYON'; 
const choices = { rock: '🪨 Камень', scissors: '✂️ Ножницы', paper: '📄 Бумага' };

document.addEventListener('DOMContentLoaded', async () => {
  const statusEl = document.getElementById('status');
  
  try {
    if (window.BastyonSdk) {
      sdk = new window.BastyonSdk();
      await sdk.init();
      
      // 1. Принудительный запрос прав у клиента Bastyon
      try {
        await sdk.permissions.request(['account', 'payment']);
      } catch (pErr) {
        console.log('Пользователь отклонил запрос прав:', pErr);
      }

      // 2. Получение адреса кошелька
      if (sdk.get && typeof sdk.get.account === 'function') {
        const account = await sdk.get.account();
        if (account && account.address) {
          userAddress = account.address;
          document.getElementById('user-address').innerText = `${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
        }
      }

      // 3. Запрос реального баланса PKOIN
      if (sdk.get && typeof sdk.get.balance === 'function') {
        try {
          const bal = await sdk.get.balance();
          const numericBalance = parseFloat(bal) || 0;
          document.getElementById('user-balance').innerText = `${numericBalance.toFixed(4)} PKOIN`;
        } catch (bErr) {
          console.warn('Ошибка получения баланса:', bErr);
        }
      }

      // 4. Запрос публичного имени и аватара по адресу из блокчейна
      if (userAddress && sdk.rpc && typeof sdk.rpc.getuserprofile === 'function') {
        try {
          const profiles = await sdk.rpc.getuserprofile([userAddress]);
          if (profiles && profiles.length > 0) {
            const p = profiles[0];
            if (p.name) document.getElementById('user-name').innerText = p.name;
            if (p.i) document.getElementById('user-avatar').src = p.i;
          }
        } catch (pErr) {
          console.warn('Ошибка чтения профиля:', pErr);
        }
      }

      // 5. Динамическое обновление баланса
      sdk.on('balance', (newBalance) => {
        const num = parseFloat(newBalance) || 0;
        document.getElementById('user-balance').innerText = `${num.toFixed(4)} PKOIN`;
      });

      sdk.emit('loaded');
      statusEl.innerText = '● Подключено к Bastyon';
      enableButtons(true);

    } else {
      statusEl.style.color = '#ff4444';
      statusEl.innerText = 'Запущено вне Bastyon (Демо-режим)';
      document.getElementById('user-name').innerText = 'Тестовый Игрок';
      document.getElementById('user-balance').innerText = '10.0000 PKOIN';
      enableButtons(true);
    }
  } catch (e) {
    console.error('Ошибка SDK:', e);
    statusEl.style.color = '#ff4444';
    statusEl.innerText = 'Ошибка инициализации SDK';
    enableButtons(true);
  }
});
  </script>
</body>
</html>
