<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра КНБ</title>

  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }

    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Профиль Bastyon */
    .profile-card {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      gap: 12px;
      text-align: left;
    }

    .profile-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #333;
      border: 2px solid #00ff88;
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-weight: bold;
      font-size: 1.05em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-balance {
      font-size: 0.9em;
      font-weight: 600;
      color: #00ff88;
      margin-top: 5px;
    }

    .rooms {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .room-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .room-btn.active {
      border-color: #00ff88;
      background: #1e3a29;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .game-btn {
      font-size: 2em;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #333;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .game-btn:hover {
      background: #444;
      transform: scale(1.05);
    }

    .game-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result {
      font-size: 1.1em;
      font-weight: bold;
      margin-top: 15px;
      min-height: 1.5em;
    }

    #status {
      color: #00ff88;
      font-size: 0.85em;
      margin-top: 15px;
    }
  </style>

</head>

    function enableButtons(enable) {

      [
        'btn-rock',
        'btn-scissors',
        'btn-paper'
      ].forEach(id => {

        const btn =
          document.getElementById(id);

        if (btn) {
          btn.disabled = !enable;
        }

      });

    }


    /*
     * ==========================================
     * ВЫБОР КОМНАТЫ
     * ==========================================
     */

    function selectRoom(room) {

      currentRoom = room;

      document
        .getElementById('mode-demo')
        .classList
        .toggle(
          'active',
          room === 'demo'
        );

      document
        .getElementById('mode-pvp')
        .classList
        .toggle(
          'active',
          room === 'pvp'
        );


      document.getElementById(
        'result-text'
      ).innerText =
        room === 'demo'
          ? 'Режим с Ботом: Бесплатная игра.'
          : 'Режим 1 PKOIN: Оплата при каждом ходе!';
