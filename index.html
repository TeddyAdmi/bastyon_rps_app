<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ — Камень Ножницы Бумага</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px 12px 30px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #303030 0%,
          #1b1b1b 34%,
          #111111 100%
        );
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px;
      background: rgba(38, 38, 38, 0.96);
      border: 1px solid #383838;
      border-radius: 20px;
      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.45);
    }

    .app-header {
      margin-bottom: 16px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 7px 0 0;
      color: #9a9a9a;
      font-size: 13px;
    }

    /* PROFILE */

    .profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 18px;
      background: #1d1d1d;
      border: 1px solid #353535;
      border-radius: 14px;
    }

    .profile-avatar {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      border: 2px solid #00ff88;
      display: block;
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-address {
      margin-top: 3px;
      color: #858585;
      font-family: monospace;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-balance {
      margin-top: 5px;
      color: #00ff88;
      font-size: 14px;
      font-weight: 800;
    }

    /* ROOMS */

    .section-title {
      margin: 4px 0 10px;
      font-size: 16px;
      font-weight: 800;
    }

    .rooms-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .room-btn {
      position: relative;
      width: 100%;
      min-height: 78px;
      padding: 12px;
      text-align: left;

      border: 1px solid #424242;
      border-radius: 14px;

      background:
        linear-gradient(
          180deg,
          #333333 0%,
          #2a2a2a 100%
        );

      color: #ffffff;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .room-btn:hover {
      background:
        linear-gradient(
          180deg,
          #3a3a3a 0%,
          #303030 100%
        );

      border-color: #5b5b5b;

      transform: translateY(-1px);
    }

    .room-btn:active {
      transform: scale(0.985);
    }

    .room-btn.active {
      border: 2px solid #00ff88;

      background:
        linear-gradient(
          180deg,
          #1f3b2c 0%,
          #1b2f24 100%
        );

      box-shadow:
        inset 0 0 0 1px
        rgba(0, 255, 136, 0.08);
    }

    .room-number {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 24px;
      height: 24px;

      margin-right: 7px;

      border-radius: 8px;

      background: #1d1d1d;
      color: #bbbbbb;

      font-size: 11px;
      font-weight: 800;

      vertical-align: middle;
    }

    .room-name {
      font-size: 14px;
      font-weight: 800;
      vertical-align: middle;
    }

    .room-stake {
      margin-top: 7px;
      color: #00ff88;
      font-size: 13px;
      font-weight: 800;
    }

    .room-mode {
      margin-top: 3px;
      color: #8e8e8e;
      font-size: 11px;
    }

    .room-badge {
      position: absolute;

      top: 9px;
      right: 9px;

      padding: 3px 6px;

      border-radius: 6px;

      background: #222;
      color: #8f8f8f;

      font-size: 9px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .room-btn.active .room-badge {
      background: #174b31;
      color: #8affbf;
    }

    /* SELECTED ROOM */

    .selected-room {
      padding: 12px 14px;
      margin-bottom: 14px;

      background: #202020;

      border: 1px solid #343434;
      border-radius: 12px;
    }

    .selected-room-label {
      color: #888;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.6px;
    }

    .selected-room-main {
      margin-top: 3px;

      font-size: 17px;
      font-weight: 800;
    }

    .selected-room-note {
      margin-top: 4px;

      color: #a2a2a2;

      font-size: 12px;
      line-height: 1.4;
    }

    /* GAME */

    .game-title {
      margin-top: 14px;

      text-align: center;

      font-size: 15px;
      font-weight: 800;
    }

    .buttons {
      display: flex;

      justify-content: center;

      gap: 12px;

      margin: 18px 0;
    }

    .game-btn {
      width: 100px;
      height: 100px;

      padding: 10px;

      border: 2px solid #444;
      border-radius: 16px;

      background: #333;
      color: #fff;

      cursor: pointer;

      font-size: 42px;

      transition:
        transform 0.15s,
        background 0.2s,
        border-color 0.2s;
    }

    .game-btn:hover:not(:disabled) {
      background: #444;

      border-color: #00ff88;

      transform: translateY(-3px);
    }

    .game-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .game-btn:disabled {
      opacity: 0.4;

      cursor: not-allowed;
    }

    /* RESULT */

    .result {
      min-height: 72px;

      margin-top: 10px;

      padding: 14px;

      border-radius: 12px;

      background: #202020;

      font-size: 15px;

      font-weight: 700;

      text-align: center;

      line-height: 1.5;
    }

    /* PVP */

    .pvp-info {
      display: none;

      margin-top: 12px;

      padding: 12px;

      border-radius: 10px;

      background: #202020;

      border: 1px solid #333;

      color: #aaa;

      font-size: 13px;

      line-height: 1.5;

      text-align: center;
    }

    .pvp-info.show {
      display: block;
    }

    .room-id {
      margin-top: 6px;

      color: #00ff88;

      font-family: monospace;
    }

    /* STATUS */

    #status {
      margin: 14px 0 0;

      color: #00ff88;

      font-size: 12px;

      text-align: center;

      line-height: 1.4;
    }

    .error {
      color: #ff5555 !important;
    }

    .warning {
      color: #ffaa00 !important;
    }

    .success {
      color: #00ff88 !important;
    }

    @media (max-width: 520px) {
      body {
        padding:
          10px 8px 20px;
      }

      .card {
        padding: 14px;

        border-radius: 16px;
      }

      .rooms-grid {
        grid-template-columns: 1fr;
      }

      .game-btn {
        width: 84px;
        height: 84px;

        font-size: 36px;
      }
    }
  </style>
</head>

  <script>

    let sdk = null;

    let userAddress = null;

    let currentRoom = "room-1";

    let currentPvpRoom = null;


    /* ROOMS */

    const ROOMS = {

      "room-1": {
        number: 1,
        name: "Новичок",
        stake: 0,
        stakeText: "бесплатно",
        mode: "demo"
      },

      "room-2": {
        number: 2,
        name: "Bronze",
        stake: 0.2,
        stakeText: "0.2 PKOIN",
        mode: "pvp"
      },

      "room-3": {
        number: 3,
        name: "Silver",
        stake: 0.5,
        stakeText: "0.5 PKOIN",
        mode: "pvp"
      },

      "room-4": {
        number: 4,
        name: "Gold",
        stake: 1,
        stakeText: "1 PKOIN",
        mode: "pvp"
      },

      "room-5": {
        number: 5,
        name: "Platinum",
        stake: 2,
        stakeText: "2 PKOIN",
        mode: "pvp"
      },

      "room-6": {
        number: 6,
        name: "Diamond",
        stake: 3,
        stakeText: "3 PKOIN",
        mode: "pvp"
      },

      "room-7": {
        number: 7,
        name: "Master",
        stake: 4,
        stakeText: "4 PKOIN",
        mode: "pvp"
      },

      "room-8": {
        number: 8,
        name: "Elite",
        stake: 5,
        stakeText: "5 PKOIN",
        mode: "pvp"
      },

      "room-9": {
        number: 9,
        name: "Champion",
        stake: 10,
        stakeText: "10 PKOIN",
        mode: "pvp"
      },

      "room-10": {
        number: 10,
        name: "Legend",
        stake: 50,
        stakeText: "50 PKOIN",
        mode: "pvp"
      }

    };


    /* DEFAULT AVATAR */

    const DEFAULT_AVATAR =
      "data:image/svg+xml;utf8," +
      "<svg xmlns='http://www.w3.org/2000/svg' " +
      "viewBox='0 0 100 100'>" +
      "<circle cx='50' cy='50' r='50' " +
      "fill='%23333333'/>" +
      "<circle cx='50' cy='38' r='18' " +
      "fill='%23888888'/>" +
      "<path d='M20 90c4-22 18-32 30-32s26 10 30 32' " +
      "fill='%23888888'/>" +
      "</svg>";


    /* CHOICES */

    const choices = {

      rock: "🪨 Камень",

      scissors: "✂️ Ножницы",

      paper: "📄 Бумага"

    };


    /* BUTTONS */

    function enableButtons(enable) {

      [
        "btn-rock",
        "btn-scissors",
        "btn-paper"

      ].forEach(function(id) {

        const button =
          document.getElementById(id);

        if (button) {

          button.disabled = !enable;

        }

      });

    }


    /* ROOM */

    function selectRoom(roomId) {

      const room =
        ROOMS[roomId];

      if (!room) {
        return;
      }

      currentRoom =
        roomId;


      document
        .querySelectorAll(".room-btn")
        .forEach(function(button) {

          button.classList.toggle(
            "active",
            button.dataset.roomId === roomId
          );

        });


      const main =
        document.getElementById(
          "selected-room-main"
        );

      const note =
        document.getElementById(
          "selected-room-note"
        );

      const result =
        document.getElementById(
          "result-text"
        );

      const pvpInfo =
        document.getElementById(
          "pvp-info"
        );


      if (room.mode === "demo") {

        main.innerText =
          room.number +
          ". " +
          room.name +
          " — бесплатно";

        note.innerText =
          "Бесплатная игра с компьютером.";

        result.innerText =
          "Бесплатная игра с компьютером.";

        pvpInfo.classList.remove(
          "show"
        );

        return;
      }


      main.innerText =
        room.number +
        ". " +
        room.name +
        " — " +
        room.stakeText;


      note.innerText =
        "PvP-комната. Реальную ставку " +
        "и отдельный матчмейкинг подключим " +
        "следующим шагом.";


      result.innerText =
        "Комната выбрана: ставка " +
        room.stakeText +
        ".";


      pvpInfo.classList.add(
        "show"
      );

    }


    /* ADDRESS */

    function shortAddress(address) {

      if (!address) {

        return "Адрес: --";

      }


      const text =
        String(address);


      if (text.length <= 12) {

        return text;

      }


      return (
        text.slice(0, 6) +
        "..." +
        text.slice(-4)
      );

    }


    function showAddress(address) {

      const element =
        document.getElementById(
          "user-address"
        );


      if (!element) {

        return;

      }


      element.innerText =
        address
          ? shortAddress(address)
          : "Адрес: не определён";

    }


    /* BALANCE */

    function findBalance(balanceData) {

      if (
        typeof balanceData ===
        "number"
      ) {

        return balanceData;

      }


      if (
        !balanceData ||
        typeof balanceData !==
        "object"
      ) {

        return null;

      }


      const priority = [

        balanceData.actual,

        balanceData.total,

        balanceData.balance,

        balanceData.confirmed,

        balanceData.available,

        balanceData.amount

      ];


      for (
        const value of priority
      ) {

        if (
          typeof value ===
            "number" &&
          Number.isFinite(value)
        ) {

          return value;

        }

      }


      return null;

    }


    function showBalance(balanceData) {

      const element =
        document.getElementById(
          "user-balance"
        );


      if (!element) {

        return;

      }


      console.log(
        "BASTYON BALANCE DATA:",
        balanceData
      );


      const balance =
        findBalance(
          balanceData
        );


      if (
        balance === null
      ) {

        element.innerText =
          "Баланс недоступен";

        element.classList.add(
          "warning"
        );

        return;

      }


      element.innerText =
        Number(balance)
          .toFixed(4) +
        " PKOIN";


      element.classList.remove(
        "warning"
      );

    }


    /* PROFILE */

    function normalizeProfile(payload) {

      if (
        !payload ||
        typeof payload !==
        "object"
      ) {

        return {};

      }


      let profile =
        payload.profile ||
        payload.result ||
        payload.data ||
        payload;


      if (
        profile &&
        typeof profile ===
          "object" &&
        profile.profile
      ) {

        profile =
          profile.profile;

      }


      if (
        Array.isArray(profile)
      ) {

        profile =
          profile[0] || {};

      }


      if (
        !profile ||
        typeof profile !==
        "object"
      ) {

        return {};

      }


      const name =
        profile.name ||
        profile.pName ||
        profile.nickname ||
        profile.username ||
        profile.displayName ||
        "";


      const avatar =
        profile.avatarUrl ||
        profile.avatar ||
        profile.image ||
        profile.imageUrl ||
        profile.i ||
        "";


      return {

        name:
          typeof name ===
          "string"
            ? name.trim()
            : "",

        avatar:
          typeof avatar ===
          "string"
            ? avatar.trim()
            : ""

      };

    }


    /* AVATAR */

    function normalizeAvatarUrl(avatar) {

      if (!avatar) {

        return "";

      }


      let url =
        String(avatar).trim();


      if (!url) {

        return "";

      }


      if (
        url.startsWith("//")
      ) {

        return (
          "https:" +
          url
        );

      }


      if (
        /^https?:\/\//i.test(
          url
        )
      ) {

        return url;

      }


      if (
        url.startsWith("data:")
      ) {

        return url;

      }


      url =
        url.replace(
          /^\/+/,
          ""
        );


      if (
        url.startsWith("ipfs/")
      ) {

        return (
          "https://pocketnet.app/" +
          url
        );

      }


      return (
        "https://pocketnet.app/ipfs/" +
        url
      );

    }


    /* LOAD PROFILE */

    async function loadProfileInfo(
      address
    ) {

      const avatarImg =
        document.getElementById(
          "user-avatar"
        );

      const nameEl =
        document.getElementById(
          "user-name"
        );


      if (!address) {

        nameEl.innerText =
          "Гость";

        avatarImg.src =
          DEFAULT_AVATAR;

        return;

      }


      avatarImg.src =
        DEFAULT_AVATAR;


      try {

        const response =
          await fetch(
            "/api/profile?address=" +
            encodeURIComponent(
              address
            ),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        console.log(
          "PROFILE HTTP STATUS:",
          response.status
        );


        const text =
          await response.text();


        let payload = {};


        try {

          payload =
            JSON.parse(text);

        } catch (
          parseError
        ) {

          console.warn(
            "PROFILE NON JSON:",
            text
          );

          throw new Error(
            "Профиль вернул не JSON"
          );

        }


        console.log(
          "BASTYON PROFILE RAW:",
          payload
        );


        if (
          !response.ok
        ) {

          throw new Error(
            payload.error ||
            payload.message ||
            "Profile HTTP " +
            response.status
          );

        }


        const profile =
          normalizeProfile(
            payload
          );


        console.log(
          "BASTYON PROFILE NORMALIZED:",
          profile
        );


        if (
          profile.name
        ) {

          nameEl.innerText =
            profile.name;

        } else {

          nameEl.innerText =
            "Игрок " +
            String(
              address
            ).slice(0, 6);

        }


        const avatarUrl =
          normalizeAvatarUrl(
            profile.avatar
          );


        if (avatarUrl) {

          avatarImg.onerror =
            function() {

              console.warn(
                "AVATAR LOAD ERROR:",
                avatarUrl
              );

              avatarImg.onerror =
                null;

              avatarImg.src =
                DEFAULT_AVATAR;

            };


          avatarImg.src =
            avatarUrl;

        }

      } catch (
        error
      ) {

        console.error(
          "PROFILE ERROR:",
          error
        );


        nameEl.innerText =
          "Игрок " +
          String(
            address
          ).slice(0, 6);


        avatarImg.src =
          DEFAULT_AVATAR;

      }

    }


    /* ACCOUNT */

    async function getAccount() {

      if (
        !sdk ||
        !sdk.get ||
        typeof sdk.get.account !==
          "function"
      ) {

        return null;

      }


      try {

        const account =
          await sdk.get.account();


        console.log(
          "BASTYON ACCOUNT RAW:",
          account
        );


        if (
          typeof account ===
          "string"
        ) {

          return account;

        }


        if (
          account &&
          typeof account ===
          "object"
        ) {

          return (
            account.address ||
            account.addr ||
            account.id ||
            account.userId ||
            null
          );

        }

      } catch (
        error
      ) {

        console.error(
          "ACCOUNT ERROR:",
          error
        );

      }


      return null;

    }


    /* BALANCE */

    async function getBalance() {

      if (
        !sdk ||
        !sdk.get ||
        typeof sdk.get.balance !==
          "function"
      ) {

        return null;

      }


      try {

        const balance =
          await sdk.get.balance();


        console.log(
          "BASTYON BALANCE RAW:",
          balance
        );


        return balance;

      } catch (
        error
      ) {

        console.error(
          "BALANCE ERROR:",
          error
        );


        return null;

      }

    }


    /* LOAD BASTYON */

    async function loadBastyonUserData() {

      userAddress =
        await getAccount();


      showAddress(
        userAddress
      );


      if (
        userAddress
      ) {

        await loadProfileInfo(
          userAddress
        );

      } else {

        document
          .getElementById(
            "user-name"
          )
          .innerText =
            "Гость";


        document
          .getElementById(
            "user-avatar"
          )
          .src =
            DEFAULT_AVATAR;

      }


      const balanceData =
        await getBalance();


      if (
        balanceData !== null
      ) {

        showBalance(
          balanceData
        );

      } else {

        const balanceElement =
          document.getElementById(
            "user-balance"
          );


        balanceElement.innerText =
          "Баланс недоступен";


        balanceElement.classList.add(
          "warning"
        );

      }

    }


    /* DEMO GAME */

    function playDemoMatch(
      userChoice
    ) {

      const keys =
        Object.keys(
          choices
        );


      const botChoice =
        keys[
          Math.floor(
            Math.random() *
            keys.length
          )
        ];


      showResult(
        userChoice,
        botChoice,
        "Бот"
      );

    }


    /* PVP */

    async function playPvpMatch(
      userChoice
    ) {

      const result =
        document.getElementById(
          "result-text"
        );


      const pvpInfo =
        document.getElementById(
          "pvp-info"
        );


      const pvpMessage =
        document.getElementById(
          "pvp-message"
        );


      const pvpRoom =
        document.getElementById(
          "pvp-room"
        );


      const room =
        ROOMS[currentRoom];


      result.innerText =
        "⏳ Подключение к PvP...";


      pvpInfo.classList.add(
        "show"
      );


      try {

        const response =
          await fetch(
            "/api/pvp/join",
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  userId:
                    userAddress ||
                    "demo-user",

                  nickname:
                    document
                      .getElementById(
                        "user-name"
                      )
                      .innerText,

                  roomId:
                    currentRoom,

                  stake:
                    room
                      ? room.stake
                      : 0

                })

            }
          );


        const text =
          await response.text();


        let data =
          null;


        try {

          data =
            JSON.parse(
              text
            );

        } catch (
          error
        ) {

          console.warn(
            "PVP returned non-JSON:",
            text
          );

        }


        if (
          !response.ok
        ) {

          result.innerText =
            "❌ PvP API: " +
            response.status;

          return;

        }


        if (
          data &&
          data.room
        ) {

          currentPvpRoom =
            data.room;


          pvpRoom.innerText =
            "Комната: " +
            currentPvpRoom.id;


          if (
            currentPvpRoom.status ===
            "waiting"
          ) {

            pvpMessage.innerText =
              "Комната создана. " +
              "Ожидание соперника...";


            result.innerText =
              "⏳ Ожидание второго игрока...";

          } else {

            pvpMessage.innerText =
              "Соперник подключён.";


            result.innerText =
              "✅ Соперник найден.";

          }

        } else {

          result.innerText =
            "Комната PvP создана.";

        }

      } catch (
        error
      ) {

        console.error(
          "PVP ERROR:",
          error
        );


        result.innerText =
          "❌ PvP сервер недоступен.";

      }

    }


    /* MOVE */

    async function makeMove(
      userChoice
    ) {

      const room =
        ROOMS[currentRoom];


      if (!room) {

        return;

      }


      if (
        room.mode ===
        "demo"
      ) {

        playDemoMatch(
          userChoice
        );

        return;

      }


      const result =
        document.getElementById(
          "result-text"
        );


      result.innerText =
        "Вы выбрали комнату " +
        room.number +
        " — " +
        room.name +
        " (" +
        room.stakeText +
        ").";


      await playPvpMatch(
        userChoice
      );

    }


    /* RESULT */

    function showResult(
      userChoice,
      opponentChoice,
      opponentName
    ) {

      let resultMessage =
        "";


      if (
        userChoice ===
        opponentChoice
      ) {

        resultMessage =
          "Ничья! Оба выбрали " +
          choices[userChoice];

      }

      else if (

        (
          userChoice ===
            "rock" &&

          opponentChoice ===
            "scissors"
        )

        ||

        (
          userChoice ===
            "scissors" &&

          opponentChoice ===
            "paper"
        )

        ||

        (
          userChoice ===
            "paper" &&

          opponentChoice ===
            "rock"
        )

      ) {

        resultMessage =
          "🎉 Вы выиграли! " +
          choices[userChoice] +
          " бьет " +
          choices[opponentChoice];

      }

      else {

        resultMessage =
          "💥 " +
          opponentName +
          " победил! " +
          choices[opponentChoice] +
          " бьет " +
          choices[userChoice];

      }


      document
        .getElementById(
          "result-text"
        )
        .innerText =
          resultMessage;

    }


    /* INIT */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        selectRoom(
          "room-1"
        );


        const status =
          document.getElementById(
            "status"
          );


        if (
          !window.BastyonSdk
        ) {

          status.classList.add(
            "error"
          );


          status.innerText =
            "❌ SDK Bastyon не обнаружен";


          enableButtons(
            true
          );


          return;

        }


        try {

          sdk =
            new window.BastyonSdk();


          if (
            typeof sdk.init ===
            "function"
          ) {

            await sdk.init();

          }


          if (
            sdk.permissions &&

            typeof
              sdk.permissions.request ===
              "function"
          ) {

            try {

              await sdk.permissions.request([

                "account",

                "payment",

                "rpc"

              ]);

            } catch (
              error
            ) {

              console.warn(
                "PERMISSIONS ERROR:",
                error
              );

            }

          }


          await loadBastyonUserData();


          if (
            typeof sdk.on ===
            "function"
          ) {

            sdk.on(
              "balance",
              function(
                newBalance
              ) {

                console.log(
                  "BASTYON BALANCE EVENT:",
                  newBalance
                );


                showBalance(
                  newBalance
                );

              }
            );

          }


          if (
            typeof sdk.emit ===
            "function"
          ) {

            sdk.emit(
              "loaded"
            );

          }


          status.classList.remove(
            "error"
          );


          status.classList.add(
            "success"
          );


          status.innerText =
            "● Bastyon подключён";


          enableButtons(
            true
          );


        } catch (
          error
        ) {

          console.error(
            "SDK ERROR:",
            error
          );


          status.classList.add(
            "error"
          );


          status.innerText =
            "❌ Ошибка SDK: " +
            (
              error.message ||
              "Ошибка"
            );


          enableButtons(
            true
          );

        }

      }
    );

  </script>
