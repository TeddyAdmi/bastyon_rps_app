<html lang="ru">
<head>

    <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

        .app {
            width: 100%;

            padding: 20px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1f2937;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 58px;

        .balance {
            margin-left: auto;

        .title {
            text-align: center;

            background: #374151;

            font-size: 42px;

            margin-bottom: 8px;
        }

        .result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 18px;
            background: #1f2937;
            text-align: center;
            min-height: 60px;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            color: #6ee7b7;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="profile">
        <img id="avatar" class="avatar"
             src="https://i.imgur.com/6VBx3io.png"
             alt="Avatar">

        <div class="profile-info">
            <div id="profileName" class="profile-name">
                Подключение...
            </div>

            <div id="profileAddress" class="profile-address">
                ...
            </div>
        </div>

        <div id="profileBalance" class="balance">
            0 PKOIN
        </div>
    </div>

    <div class="title">
        КНБ
    </div>

    <div class="subtitle">
        Камень • Ножницы • Бумага
    </div>

    <div class="choices">

        <button class="choice" onclick="play('rock')">
            <span class="choice-image">🪨</span>
            Камень
        </button>

        <button class="choice" onclick="play('scissors')">
            <span class="choice-image">✂️</span>
            Ножницы
        </button>

        <button class="choice" onclick="play('paper')">
            <span class="choice-image">📄</span>
            Бумага
        </button>

    </div>

    <div id="result" class="result">
        Сделайте ход
    </div>

    <div id="status" class="status">
        Подключение к Bastyon...
    </div>

</div>

<script>

let sdk = null;
let account = null;
let balance = null;


/* =========================================
   BASTYON
========================================= */

async function initBastyon() {

    console.log("========== BASTYON START ==========");

    try {

        sdk = new BastyonSdk();

        await sdk.init();

        console.log("BASTYON SDK INITIALIZED");

        sdk.emit("loaded");

        /* ACCOUNT */

        account = await sdk.get.account();

        console.log("BASTYON ACCOUNT:", account);

        if (account && account.address) {

            document.getElementById("profileAddress").textContent =
                account.address;

            document.getElementById("profileName").textContent =
                "Игрок " + account.address.substring(0, 6);

        }


        /* BALANCE */

        balance = await sdk.get.balance();

        console.log("BASTYON BALANCE:", balance);

        if (balance) {

            document.getElementById("profileBalance").textContent =
                Number(balance.actual || balance.total || 0).toFixed(4) +
                " PKOIN";

        }


        /* =====================================
           ПРОВЕРЯЕМ CHANNEL()
        ===================================== */

        if (sdk.helpers && sdk.helpers.channel && account) {

            console.log("========== CHANNEL TEST ==========");

            console.log(
                "CALLING sdk.helpers.channel():",
                account.address
            );

            try {

                const channelResult =
                    await sdk.helpers.channel(account.address);

                console.log(
                    "CHANNEL RESULT:",
                    channelResult
                );

            } catch (channelError) {

                console.error(
                    "CHANNEL ERROR:",
                    channelError
                );

            }

        } else {

            console.log(
                "sdk.helpers.channel() недоступен"
            );

        }


        /* SDK DEBUG */

        console.log(
            "BASTYON SDK OBJECT:",
            sdk
        );

        console.log(
            "BASTYON SDK GET:",
            sdk.get
        );

        console.log(
            "BASTYON SDK HELPERS:",
            sdk.helpers
        );

        console.log(
            "SDK.GET KEYS:",
            Object.keys(sdk.get || {})
        );

        console.log(
            "SDK.HELPERS KEYS:",
            Object.keys(sdk.helpers || {})
        );


        document.getElementById("status").textContent =
            "Bastyon подключён";

        console.log("========== BASTYON READY ==========");

    } catch (error) {

        console.error(
            "BASTYON ERROR:",
            error
        );

        document.getElementById("status").textContent =
            "Ошибка подключения Bastyon";

    }

}


/* =========================================
   GAME
========================================= */

function play(playerChoice) {

    const choices = [
        "rock",
        "scissors",
        "paper"
    ];

    const computerChoice =
        choices[Math.floor(Math.random() * choices.length)];

    let result = "";

    if (playerChoice === computerChoice) {

        result = "Ничья 🤝";

    } else if (

        (playerChoice === "rock" &&
            computerChoice === "scissors") ||

        (playerChoice === "scissors" &&
            computerChoice === "paper") ||

        (playerChoice === "paper" &&
            computerChoice === "rock")

    ) {

        result = "Вы выиграли! 🎉";

    } else {

        result = "Вы проиграли";

    }

    document.getElementById("result").innerHTML =
        "Ваш ход: <b>" + playerChoice + "</b><br>" +
        "Ход компьютера: <b>" + computerChoice + "</b><br><br>" +
        result;

}


/* =========================================
   START
========================================= */

initBastyon();

</script>

</body>
</html>
